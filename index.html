    s:{
      greet:'<p>Kumusta! Ako ang Katulong ng Botante sa California. Maipapaliwanag ko kung paano magparehistro, ang mga deadline, kung paano bumoto sa koreo o nang personal, at kung sino ang makakausap.</p><p>Pumili ng tanong sa ibaba o i-type ang sarili mong tanong.</p>',
      reg:'<p>Ang pinakamabilis ay magparehistro online sa {REG}. Piliin ang <strong>Register to Vote Now</strong>. Ilang minuto lang ito at available ang website sa 10 wika.</p><p>Ihanda ang mga sumusunod.</p><ul><li>Numero ng lisensya sa pagmamaneho o ID ng California, o ang huling apat na numero ng Social Security number</li><li>Petsa ng kapanganakan</li></ul><p>Walang computer? Tumawag sa {HOT} o sa tanggapan ng halalan ng iyong county at humiling ng papel na porma sa koreo.</p>',
      regOpen:'<p><strong>Ang deadline ng pagpaparehistro para sa halalan sa Nobyembre 3 ay Lunes, Oktubre 19, 2026.</strong> Dapat maisumite online sa araw na iyon, at ang ipinadala sa koreo ay dapat may postmark na hindi lalampas doon.</p><p>Kung hindi umabot, maaari ka pa ring magparehistro at bumoto sa mismong araw (piliin ang “Lumampas na ako sa deadline”).</p>',
      regCond:'<p><strong>Lumipas na ang karaniwang deadline para sa halalan sa Nobyembre 3 (Oktubre 19).</strong> Maaari ka pa ring magparehistro at bumoto sa mismong araw. Piliin ang “Lumampas na ako sa deadline” para sa paraan.</p>',
      regOver:'<p>Tapos na ang halalan noong Nobyembre 3, 2026. Sa California, ang karaniwang deadline ng rehistro ay 15 araw bago ang Araw ng Halalan. Ang mga petsa ng susunod na halalan ay nasa {SOS}.</p>',
      late:'<p>Maaari ka pa ring makilahok. May <strong>pagpaparehistro sa mismong araw</strong> ang California, na tinatawag ding conditional voter registration, para sa mga hindi nakapagparehistro nang maaga.</p><ul><li>Maaari ito hanggang sa mismong Araw ng Halalan.</li><li>Pumunta sa tanggapan ng halalan ng iyong county o sa anumang vote center, magparehistro, at bumoto gamit ang pansamantalang balota sa mismong lugar.</li><li>Mabibilang ang iyong balota kapag nakumpirma ng county ang iyong rehistro.</li><li>Maaaring hingan ka ng ID, kaya dalhin ang lisensya o ibang dokumentong may pangalan at address mo.</li></ul><p>Maghanap ng lugar sa {CENTERS}. Sa Araw ng Halalan, bukas ang mga vote center mula 7 n.u. hanggang 8 n.g.</p>',
      elig:'<p>Maaari kang magparehistro sa California kung natutugunan mo ang mga sumusunod.</p><ul><li>Mamamayan ka ng U.S. at residente ng California</li><li>Hindi bababa sa 18 taong gulang sa Araw ng Halalan</li><li>Hindi kasalukuyang nagsisilbi ng sentensya sa bilangguan ng estado o pederal dahil sa felony</li><li>Hindi idineklara ng hukuman na walang kakayahang bumoto</li></ul><p><strong>Mahalaga.</strong> Ang green card (permanenteng residente) o visa lamang ay <strong>hindi</strong> sapat para magparehistro. Dapat kang mamamayan ng U.S. Ang naturalized na mamamayan ay maaaring magparehistro tulad ng iba. Ang pagpaparehistro nang hindi kwalipikado ay maaaring magdulot ng malubhang problema, kaya kung may duda, tumawag muna sa {HOT}.</p><p>Ang 16 o 17 taong gulang ay maaaring mag-pre-register sa {REG} at awtomatikong magiging rehistrado pagtuntong ng 18.</p>',
      status:'<p>Tatlong mabilis na paraan para tingnan.</p><ul><li>Online gamit ang My Voter Status sa {STATUS}</li><li>Mag-text ng <strong>VOTE</strong> sa <strong>GOVOTE (468-683)</strong></li><li>Tumawag sa {HOT}</li></ul><p>Ipinapakita rin nito ang iyong county at piniling partido.</p>',
      dates:'<p>Mahahalagang petsa para sa <strong>Pangkalahatang Halalan sa Nobyembre 3, 2026</strong>.</p><ul><li><strong>Oktubre 5</strong> Sisimulan ng mga county ang pagpapadala ng balota sa koreo</li><li><strong>Oktubre 6</strong> Bukas na ang mga ligtas na drop box</li><li><strong>Oktubre 19</strong> Huling araw ng karaniwang pagpaparehistro</li><li><strong>Oktubre 20 hanggang Nobyembre 3</strong> Pagpaparehistro sa mismong araw sa tanggapan ng county at mga vote center</li><li><strong>Oktubre 24</strong> Bukas ang ilang vote center sa mga county na gumagamit ng modelong ito</li><li><strong>Oktubre 31</strong> Bukas na ang iba pang vote center</li><li><strong>Nobyembre 3</strong> Araw ng Halalan, 7 n.u. hanggang 8 n.g.</li></ul><p>Ang balota sa koreo ay dapat may postmark na Nobyembre 3 o mas maaga at dumating sa loob ng 7 araw. Ang buong kalendaryo ay nasa {SOS}.</p>',
      datesOver:'<p>Tapos na ang halalan noong Nobyembre 3, 2026. Ganito karaniwan ang mga tuntunin sa bawat halalan sa California.</p><ul><li>Magparehistro nang hindi bababa sa <strong>15 araw</strong> bago ang Araw ng Halalan. Pagkatapos nito, puwede ang pagpaparehistro sa mismong araw.</li><li>Nagsisimulang magpadala ang mga county ng balota sa koreo sa lahat ng aktibong botante mga 29 araw bago ang halalan.</li><li>Nagbubukas ang mga vote center mga 10 araw bago, at mas marami pa mga 3 araw bago.</li><li>Ang huling araw para humiling ng kapalit na balota sa koreo ay 7 araw bago ang Araw ng Halalan.</li><li>Sa Araw ng Halalan, bukas ang botohan mula <strong>7 n.u. hanggang 8 n.g.</strong></li><li>Ang balota sa koreo ay dapat may postmark ng Araw ng Halalan o mas maaga at dumating sa loob ng 7 araw.</li></ul><p>Ang eksaktong petsa ng susunod na halalan ay nasa {SOS}.</p>',
      mail:'<p>Awtomatikong nagpapadala ang California ng balota sa koreo sa bawat aktibong rehistradong botante bago ang bawat halalan, kaya hindi mo na kailangang humiling.</p><p>Maaari mo itong ibalik sa alinman sa mga paraang ito.</p><ul><li><strong>Sa koreo.</strong> Bayad na ang selyo. Dapat may postmark ng Araw ng Halalan o mas maaga at dumating sa county sa loob ng 7 araw.</li><li><strong>Sa drop box.</strong> Bukas na ang mga ligtas na drop box.</li><li><strong>Nang personal.</strong> Sa tanggapan ng halalan ng county, vote center, o lugar ng botohan bago mag-8 n.g. sa Araw ng Halalan.</li></ul><p>Pirmahan ang sobre ng balota para mabilang ito. Kung malapit na ang halalan, pinakaligtas ang drop box o vote center.</p>',
      nbOpen:'<p><strong>Huli na para humiling ng kapalit na balota sa koreo para sa halalang ito.</strong> Ang huling araw ng paghiling ay Oktubre 27. <strong>Pero maaari ka pa ring bumoto nang personal.</strong> Pumunta sa tanggapan ng halalan ng county o sa anumang vote center at kunin ang balota doon mismo. Sa Nobyembre 3, bukas sila mula 7 n.u. hanggang 8 n.g., at kung nasa pila ka pagsapit ng 8 n.g., makakaboto ka pa rin.</p>',
      nbOver:'<p>Kung nawala, nasira, o hindi dumating ang balota, makipag-ugnayan agad sa tanggapan ng halalan ng county para humiling ng kapalit. Maaaring humiling sa koreo hanggang 7 araw bago ang Araw ng Halalan. Pagkatapos nito, maaari ka pa ring bumoto nang personal sa tanggapan ng county o vote center.</p>',
      nbTail:'<ul><li>Ang natapunan o nasirang balota ay itinuturing na parang nawalang balota.</li><li>Karaniwang dahilan ng hindi pagdating ay luma na ang rehistradong address (hindi ipinapasa ang balota), nagparehistro pagkatapos ng deadline, o hindi aktibo ang rehistro. Tingnan sa {STATUS}.</li><li>Kung nasa labas ka ng California, tumawag sa tanggapan ng county o sa {HOT} at itanong kung maipapadala sa kinaroroonan mo. Mabibilang ang balota sa koreo kung may postmark ng Araw ng Halalan o mas maaga at dumating sa loob ng 7 araw.</li><li>Hanapin ang pinakamalapit na vote center sa {CENTERS}.</li></ul>',
      inperson:'<p>Maaari kang bumoto nang personal kahit nakatanggap ka ng balota sa koreo. Hindi ako makakahanap ng lugar ayon sa ZIP code, pero mahahanap mo ang pinakamalapit na vote center, drop box, o lugar ng botohan sa {CENTERS}. Ilagay ang buong address o piliin ang iyong county.</p><ul><li>Bago ang Araw ng Halalan, karaniwang bukas ang mga vote center araw-araw mula 10 n.u. hanggang 7 n.g., depende sa county.</li><li>Sa Araw ng Halalan, bukas mula <strong>7 n.u. hanggang 8 n.g.</strong></li><li>Kung nasa pila ka pagsapit ng 8 n.g., makakaboto ka pa rin.</li></ul><p>Dalhin ang balota sa koreo kung mayroon, o sabihin sa staff na gusto mong bumoto doon. Kung nakumpleto mo na ang balota, maaari mo rin itong ihulog sa anumang ligtas na drop box o vote center sa halip na ipadala sa koreo.</p>',
      id:'<p>Karamihan ng botante sa California ay <strong>hindi kailangang magpakita ng ID</strong> para bumoto. Karaniwang hindi rin problema kung nawala ang ID o walang pasaporte.</p><ul><li>Kung nakaboto ka na dati sa California, hindi mo kailangan ng ID.</li><li>Kung nagparehistro ka gamit ang numero ng lisensya o ID ng California, o ang huling apat na numero ng Social Security, kadalasan ay hindi ka hihingan.</li><li>Ang pangunahing eksepsyon ay ang unang beses na bumoboto, nagparehistro sa koreo, at hindi nagbigay ng alinman sa mga numerong iyon. Kung hingan ka, sapat na ang anumang dokumentong may pangalan at address. Hindi kailangang may litrato o pasaporte.</li></ul><p>Kung gagamit ka ng pagpaparehistro sa mismong araw, itanong sa tanggapan ng county kung ano ang dadalhin. Maaari ka ring tumawag muna sa {HOT}. Kung nawala ang ID mo, maaari ka pa ring pumunta sa vote center at ipaliwanag ang sitwasyon sa staff.</p>',
      contact:'<p>Narito ako anumang oras, pero kung gusto mong makausap ang tao, narito ang mga mapagtatanungan.</p><ul><li><strong>Voter hotline ng Kalihim ng Estado (Tagalog)</strong> {HOT}</li><li><strong>Email</strong> <a href="mailto:elections@sos.ca.gov">elections@sos.ca.gov</a></li><li><strong>Tanggapan ng halalan ng iyong county</strong> Doon nakatago ang iyong rehistro at kadalasan ito ang pinakamabilis para sa lokal na tanong. Hanapin sa {SOS}.</li></ul><p>Kung sarado ang hotline kapag nakakatawag ka, maaari kang mag-email, gamitin ang katulong na ito anumang oras, o mag-text ng <strong>VOTE</strong> sa <strong>GOVOTE (468-683)</strong> para tingnan ang rehistro.</p>',
      thanks:'<p>Walang anuman. May iba pa ba akong maitutulong?</p>'
    }

    s:{
      greet:'<p>안녕하세요! 저는 캘리포니아 유권자 도우미입니다. 등록 방법, 마감일, 우편 또는 직접 투표 방법, 문의할 곳을 안내해 드립니다.</p><p>아래 질문을 누르시거나 직접 질문을 입력하세요.</p>',
      reg:'<p>가장 빠른 방법은 {REG}에서 온라인으로 등록하는 것입니다. <strong>Register to Vote Now</strong>(지금 등록)를 선택하세요. 몇 분이면 되고 사이트는 10개 언어를 지원합니다.</p><p>다음을 준비하세요.</p><ul><li>캘리포니아 운전면허증 또는 신분증 번호, 또는 사회보장번호 뒤 4자리</li><li>생년월일</li></ul><p>컴퓨터가 없으면 {HOT} 또는 거주 카운티 선거 사무소에 전화해서 종이 양식을 우편으로 보내 달라고 하세요.</p>',
      regOpen:'<p><strong>11월 3일 선거의 등록 마감일은 2026년 10월 19일 월요일입니다.</strong> 온라인 신청은 그날까지 제출해야 하고, 우편 신청은 소인이 그날이거나 그 이전이어야 합니다.</p><p>마감을 놓쳤더라도 당일 등록 후 투표할 수 있습니다. “마감일을 놓쳤어요”를 눌러 보세요.</p>',
      regCond:'<p><strong>11월 3일 선거의 일반 등록 마감일(10월 19일)은 지났습니다.</strong> 그래도 당일 등록 후 투표할 수 있습니다. 방법은 “마감일을 놓쳤어요”를 눌러 확인하세요.</p>',
      regOver:'<p>2026년 11월 3일 선거는 끝났습니다. 캘리포니아의 일반 등록 마감일은 선거일 15일 전입니다. 다음 선거 날짜는 {SOS}에서 확인하세요.</p>',
      late:'<p>아직 참여할 수 있습니다. 캘리포니아는 제때 등록하지 못한 분을 위해 <strong>당일 등록</strong>(조건부 유권자 등록)을 제공합니다.</p><ul><li>선거일 당일까지 가능합니다.</li><li>거주 카운티 선거 사무소나 아무 투표 센터에 가서 등록하고 그 자리에서 임시 투표용지로 투표하세요.</li><li>카운티가 등록을 확인하면 투표가 집계됩니다.</li><li>신분 확인을 요청받을 수 있으니 운전면허증이나 이름과 주소가 나온 서류를 가져가세요.</li></ul><p>장소는 {CENTERS}에서 찾으세요. 선거일에는 투표 센터가 오전 7시부터 오후 8시까지 운영됩니다.</p>',
      elig:'<p>다음 조건을 충족하면 캘리포니아에서 유권자 등록을 할 수 있습니다.</p><ul><li>미국 시민이며 캘리포니아 거주자</li><li>선거일 기준 만 18세 이상</li><li>중범죄로 주 교도소나 연방 교도소에서 복역 중이 아님</li><li>법원에서 투표 능력이 없다고 판결받지 않음</li></ul><p><strong>중요.</strong> 영주권(그린카드)이나 비자만으로는 등록할 수 <strong>없습니다</strong>. 미국 시민이어야 합니다. 귀화한 시민은 다른 시민과 똑같이 등록할 수 있습니다. 자격이 없는데 등록하면 심각한 문제가 생길 수 있으니 확실하지 않으면 먼저 {HOT}로 문의하세요.</p><p>16세 또는 17세는 {REG}에서 사전 등록할 수 있고 만 18세가 되면 자동으로 등록됩니다.</p>',
      status:'<p>빠른 확인 방법 세 가지입니다.</p><ul><li>온라인 My Voter Status 도구 {STATUS}</li><li><strong>GOVOTE (468-683)</strong>로 <strong>VOTE</strong> 문자 보내기</li><li>{HOT}로 전화</li></ul><p>소속 카운티와 선택한 정당도 함께 표시됩니다.</p>',
      dates:'<p><strong>2026년 11월 3일 총선거</strong>의 중요한 날짜입니다.</p><ul><li><strong>10월 5일</strong> 카운티에서 우편 투표용지 발송 시작</li><li><strong>10월 6일</strong> 보안 투표함 운영 시작</li><li><strong>10월 19일</strong> 일반 등록 마감일</li><li><strong>10월 20일~11월 3일</strong> 카운티 사무소와 투표 센터에서 당일 등록</li><li><strong>10월 24일</strong> 해당 방식을 쓰는 카운티의 일부 투표 센터 개방</li><li><strong>10월 31일</strong> 나머지 투표 센터 개방</li><li><strong>11월 3일</strong> 선거일, 오전 7시~오후 8시</li></ul><p>우편 투표용지는 소인이 11월 3일 또는 그 이전이어야 하며 7일 이내에 도착해야 합니다. 전체 일정은 {SOS}에서 확인하세요.</p>',
      datesOver:'<p>2026년 11월 3일 선거는 끝났습니다. 캘리포니아 선거에는 대체로 다음 규칙이 적용됩니다.</p><ul><li>선거일 <strong>15일 전</strong>까지 등록합니다. 그 후에는 당일 등록을 이용할 수 있습니다.</li><li>카운티는 선거 약 29일 전부터 모든 활성 유권자에게 우편 투표용지를 보냅니다.</li><li>투표 센터는 약 10일 전에 열고 약 3일 전에는 더 많이 엽니다.</li><li>우편 대체 투표용지 요청 마감은 선거일 7일 전입니다.</li><li>선거일 투표 시간은 <strong>오전 7시~오후 8시</strong>입니다.</li><li>우편 투표용지는 소인이 선거일 또는 그 이전이어야 하며 7일 이내에 도착해야 합니다.</li></ul><p>다음 선거의 정확한 날짜는 {SOS}에서 확인하세요.</p>',
      mail:'<p>캘리포니아는 모든 선거 전에 활성 등록 유권자에게 우편 투표용지를 자동으로 보내므로 따로 신청할 필요가 없습니다.</p><p>다음 중 한 가지 방법으로 제출하세요.</p><ul><li><strong>우편.</strong> 우표는 이미 지불되어 있습니다. 소인이 선거일 또는 그 이전이어야 하고 7일 이내에 카운티에 도착해야 합니다.</li><li><strong>투표함.</strong> 보안 투표함이 이미 운영 중입니다.</li><li><strong>직접 제출.</strong> 선거일 오후 8시까지 카운티 선거 사무소, 투표 센터, 투표소에 제출합니다.</li></ul><p>투표용지 봉투에 서명해야 집계됩니다. 선거일이 가까우면 투표함이나 투표 센터가 가장 안전합니다.</p>',
      nbOpen:'<p><strong>이번 선거에서는 우편으로 대체 투표용지를 요청하기에는 이미 늦었습니다.</strong> 요청 마감일은 10월 27일이었습니다. <strong>하지만 직접 투표할 수 있습니다.</strong> 카운티 선거 사무소나 아무 투표 센터에 가면 현장에서 투표용지를 받아 투표할 수 있습니다. 11월 3일에는 오전 7시부터 오후 8시까지 운영되며 오후 8시에 줄을 서 있으면 투표할 수 있습니다.</p>',
      nbOver:'<p>투표용지를 잃어버렸거나 훼손되었거나 받지 못했다면 가능한 한 빨리 카운티 선거 사무소에 연락해 대체본을 요청하세요. 우편 요청은 선거일 7일 전까지 가능합니다. 그 이후에도 카운티 사무소나 투표 센터에서 직접 투표할 수 있습니다.</p>',
      nbTail:'<ul><li>음료 등을 쏟아 훼손된 투표용지는 분실한 것과 똑같이 처리됩니다.</li><li>못 받는 흔한 이유는 등록 주소가 오래되었거나(우편물 전달 안 됨), 마감 후에 등록했거나, 등록 상태가 활성이 아닌 경우입니다. {STATUS}에서 확인하세요.</li><li>캘리포니아 밖에 계시면 카운티 선거 사무소나 {HOT}에 전화해서 현재 계신 곳으로 보내 줄 수 있는지 문의하세요. 소인이 선거일 또는 그 이전이고 7일 이내에 도착하면 집계됩니다.</li><li>가장 가까운 투표 센터는 {CENTERS}에서 찾으세요.</li></ul>',
      inperson:'<p>우편 투표용지를 받았더라도 직접 투표할 수 있습니다. 저는 우편번호로 장소를 찾아 드릴 수 없지만 {CENTERS}에서 전체 주소를 입력하거나 카운티를 선택하면 가장 가까운 투표 센터, 투표함, 투표소를 찾을 수 있습니다.</p><ul><li>선거일 전에는 투표 센터가 보통 매일 오전 10시~오후 7시에 열며 카운티마다 조금 다릅니다.</li><li>선거일에는 <strong>오전 7시~오후 8시</strong>에 운영합니다.</li><li>오후 8시에 줄을 서 있으면 투표할 수 있습니다.</li></ul><p>우편 투표용지가 있으면 가져가거나, 직원에게 현장에서 투표하겠다고 말하세요. 이미 작성했다면 우편 대신 보안 투표함이나 투표 센터에 넣어도 됩니다.</p>',
      id:'<p>대부분의 캘리포니아 유권자는 투표할 때 <strong>신분증을 보여 줄 필요가 없습니다</strong>. 신분증을 잃어버렸거나 여권이 없어도 보통 문제되지 않습니다.</p><ul><li>캘리포니아에서 이전에 투표한 적이 있으면 신분증이 필요 없습니다.</li><li>캘리포니아 운전면허증 또는 신분증 번호나 사회보장번호 뒤 4자리로 등록했다면 보통 요구받지 않습니다.</li><li>주된 예외는 처음 투표하면서 우편으로 등록했고 그 번호들을 제공하지 않은 경우입니다. 요구받으면 이름과 주소가 나온 서류면 충분하며 사진이 있는 신분증이나 여권일 필요는 없습니다.</li></ul><p>당일 등록을 이용할 경우 카운티 선거 사무소에 무엇을 가져가야 하는지 물어보세요. 가기 전에 {HOT}로 전화해도 됩니다. 신분증을 잃어버렸더라도 투표 센터에 가서 직원에게 상황을 설명할 수 있습니다.</p>',
      contact:'<p>저는 언제든 이용할 수 있지만 담당자와 직접 이야기하고 싶으시다면 아래로 문의하세요.</p><ul><li><strong>총무장관실 유권자 전화(한국어)</strong> {HOT}</li><li><strong>이메일</strong> <a href="mailto:elections@sos.ca.gov">elections@sos.ca.gov</a></li><li><strong>거주 카운티 선거 사무소</strong> 유권자 등록 기록이 보관되어 있어 지역 문의에는 보통 가장 빠릅니다. {SOS}에서 찾으세요.</li></ul><p>전화 가능한 시간에 상담 전화가 닫혀 있다면 이메일을 보내거나 이 도우미를 언제든 사용하거나 <strong>GOVOTE (468-683)</strong>로 <strong>VOTE</strong> 문자를 보내 등록 상태를 확인하세요.</p>',
      thanks:'<p>천만에요. 더 도와드릴 일이 있나요?</p>'
    }
  });

  /* ---------- UI ---------- */
  I18N.en = { code:"en", name:"English", ui:{
    title:"California Voter Helper", sub:"Plain answers about registering and voting.", tag:"No login needed",
    ph:"Ask about registering, deadlines, mail ballots…", send:"Send", label:"Type your question",
    footer:'This is an independent helper and not an official government site. Always confirm important details with the <a href="https://www.sos.ca.gov/elections/" target="_blank" rel="noopener">California Secretary of State</a> or your county elections office.',
    banner:{ open:"Election Day is November 3, 2026. Register by October 19.", conditional:"Election Day is November 3, 2026. Same-day registration is open at vote centers.", over:"The November 3, 2026 election has passed. Answers are general. Check sos.ca.gov/elections for the next one." }
  }};
  var LANGS = ["en","es","zh","vi","tl","ko"];
  var LANG = "en";
  var pack = I18N.en;

  var log = document.getElementById("log");
  var chips = document.getElementById("chips");
  var form = document.getElementById("form");
  var input = document.getElementById("q");
  var banner = document.getElementById("banner");
  var langSel = document.getElementById("lang");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var FALLBACK_NEXT = ["register","dates","mail","inperson","status","contact"];

  function topicFor(id){
    if(LANG!=="en" && pack.topics && pack.topics[id]) return pack.topics[id];
    return T[id];
  }
  function isNative(id){ return LANG==="en" || !!(pack.topics && pack.topics[id]); }

  function applyUi(){
    var u = pack.ui;
    document.documentElement.lang = LANG==="zh" ? "zh-Hans" : LANG;
    document.title = u.title;
    document.getElementById("t-title").textContent = u.title;
    document.getElementById("t-sub").textContent = u.sub;
    document.getElementById("t-tag").textContent = u.tag;
    input.placeholder = u.ph;
    document.getElementById("send").textContent = u.send;
    document.getElementById("q-label").textContent = u.label;
    document.getElementById("foot").innerHTML = u.footer;
    var b = u.banner[PHASE]; banner.textContent = b || ""; banner.hidden = !b;
  }

  function addMsg(html, who){
    var row = document.createElement("div");
    var typing = who.indexOf("typing") !== -1;
    var kind = who.indexOf("user") !== -1 ? "user" : "bot";
    row.className = "row " + kind;
    if(kind==="bot"){
      var av = document.createElement("span");
      av.className = "av"; av.setAttribute("aria-hidden","true");
      av.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      row.appendChild(av);
    }
    var d = document.createElement("div");
    d.className = "msg " + kind;
    if(typing){ d.innerHTML = '<span class="dots" role="status" aria-label="…"><i></i><i></i><i></i></span>'; }
    else if(kind==="user"){ d.textContent = html; }
    else { d.innerHTML = html; }
    row.appendChild(d);
    log.appendChild(row);
    if(kind==="bot" && !typing){ log.scrollTop += row.getBoundingClientRect().top - log.getBoundingClientRect().top - 8; }
    else { log.scrollTop = log.scrollHeight; }
    return row;
  }

  function showChips(ids){
    chips.innerHTML = "";
    ids.forEach(function(id){
      var t = topicFor(id); if(!t || !t.label || !isNative(id)) return;
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = t.label;
      b.addEventListener("click", function(){ ask(t.label, id); });
      chips.appendChild(b);
    });
  }

  function reply(id){
    var typing = addMsg("", "bot typing");
    var wait = reduce ? 0 : 450;
    setTimeout(function(){
      typing.remove();
      var html, next;
      if(id==="fallback"){
        html = LANG==="en" ? T.fallback.html() : pack.ui.fallback;
        next = LANG==="en" ? T.fallback.next : FALLBACK_NEXT;
      } else {
        var t = topicFor(id);
        html = t.html(); next = t.next || FALLBACK_NEXT;
        if(!isNative(id)) html = pack.ui.onlyEnglish + html;
      }
      addMsg(html, "bot");
      showChips(next);
    }, wait);
  }

  /* Fold accents and punctuation so typing without accents still matches. */
  function norm(s){
    s = s.toLowerCase().replace(/[‘’ʼ]/g,"'");
    try { s = s.normalize("NFD").replace(/[̀-ͯ]/g,""); } catch(e){}
    s = s.replace(/đ/g,"d");
    return " " + s.replace(/[\u0000-&(-/:-@[-`{-¿ -⁯　-〿＀-／：-＠]/g," ").replace(/\s+/g," ").trim() + " ";
  }
  function needleFor(k, stem){
    var n = norm(k);
    if(!stem) return n;
    return (/^\s/.test(k)?" ":"") + n.trim() + (/\s$/.test(k)?" ":"");
  }
  function weight(needle){
    var core = needle.trim();
    return (core.length > 3 || /[^\x00-\x7f]/.test(core)) ? 2 + core.split(" ").length : 1;
  }

  /* Score every topic in a set. Stem mode lets "registr" match "registrarme". */
  function matchIn(set, text, stem, skipIds){
    var s = norm(text), best = null, bestScore = 0;
    Object.keys(set).forEach(function(id){
      if(skipIds && skipIds[id]) return;
      var tp = set[id];
      var kw = tp.kw || (tp.test ? [] : null); if(!kw) return;
      var score = 0;
      kw.forEach(function(k){
        var needle = needleFor(k, stem);
        if(needle.trim() && s.indexOf(needle) !== -1) score += weight(needle);
      });
      if(tp.test && tp.test(text)) score += 15;
      if(tp.strong){ tp.strong.forEach(function(k){ var n = needleFor(k, stem); if(n.trim() && s.indexOf(n)!==-1) score += 20; }); }
      if(score>0 && tp.boost) score += tp.boost;
      if(score > bestScore){ bestScore = score; best = id; }
    });
    return best;
  }

  function match(text){
    if(LANG==="en") return matchIn(T, text, false);
    var hit = matchIn(pack.topics, text, true);
    if(hit) return hit;
    return matchIn(T, text, false, pack.topics);
  }

  function ask(text, forcedId){
    addMsg(text, "user");
    reply(forcedId || match(text) || "fallback");
  }

  function startConversation(){
    log.innerHTML = ""; chips.innerHTML = "";
    var g = topicFor("greet");
    addMsg(g.html(), "bot");
    showChips(g.next);
  }

  function setLang(code, quiet){
    if(LANGS.indexOf(code)===-1 || !I18N[code]) code = "en";
    LANG = code; pack = I18N[code];
    if(langSel) langSel.value = code;
    try { localStorage.setItem("cvh-lang", code); } catch(e){}
    applyUi();
    if(!quiet) startConversation();
  }

  if(langSel){
    LANGS.forEach(function(c){
      var o = document.createElement("option"); o.value = c; o.textContent = I18N[c].name; langSel.appendChild(o);
    });
    langSel.addEventListener("change", function(){ setLang(langSel.value); input.focus(); });
  }
  log.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-lang]") : null;
    if(b){ setLang(b.getAttribute("data-lang")); }
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var v = input.value.trim(); if(!v) return;
    input.value = "";
    ask(v);
  });

  var saved = "en";
  try { saved = localStorage.getItem("cvh-lang") || "en"; } catch(e){}
  setLang(saved, true);
  startConversation();
})();
</script>
</body>
</html>
