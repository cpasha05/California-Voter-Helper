<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>California Voter Helper</title>
<meta name="description" content="Quick answers about registering to vote and voting in California. No login needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEEFF3; --card:#FFFFFF; --ink:#14171F; --muted:#545B6B; --line:#D6D9E2;
    --head:#1B2A5C; --head-ink:#FFFFFF; --accent:#C8283A; --accent-ink:#FFFFFF; --accent-soft:#FBE4E7;
    --user:#1B2A5C; --user-ink:#FFFFFF; --link:#1B3FA0; --av:#1B2A5C; --av-ink:#FFFFFF; --chip-line:#1B2A5C;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0C1018; --card:#151B28; --ink:#EAEDF5; --muted:#A8B0C2; --line:#2B3548;
      --head:#16224B; --head-ink:#FFFFFF; --accent:#FF7A88; --accent-ink:#1A0A0D; --accent-soft:#3A1A22;
      --user:#2B4CB3; --user-ink:#FFFFFF; --link:#9DB6FF; --av:#2B4CB3; --av-ink:#FFFFFF; --chip-line:#8FA6F0;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:18px;line-height:1.5;display:flex;justify-content:center}
  .app{width:100%;max-width:800px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
  @media (min-width:900px){
    body{padding:24px 0}
    .app{height:calc(100% - 0px);border-radius:22px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(10,30,45,.16)}
  }
  header{background:var(--head);color:var(--head-ink);padding:16px 20px;display:flex;align-items:center;gap:14px;border-bottom:5px solid var(--accent)}
  .mark{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
  .titles{min-width:0;flex:1}
  header h1{margin:0;font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;font-size:1.55rem;line-height:1.1;font-weight:700;letter-spacing:-.01em}
  header p{margin:3px 0 0;font-size:.92rem;opacity:.9}
  .tag{flex:none;font-size:.8rem;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 10px;white-space:nowrap}
  @media (max-width:520px){.tag{display:none}}
  .banner{background:var(--accent-soft);color:var(--ink);padding:9px 20px;font-size:.92rem;font-weight:700;border-bottom:1px solid var(--line);border-left:6px solid var(--accent)}
  .banner[hidden]{display:none}
  #log{flex:1;overflow-y:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .row{display:flex;gap:10px;align-items:flex-start;max-width:100%}
  .row.user{justify-content:flex-end}
  .av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--av);color:var(--av-ink);display:grid;place-items:center}
  .msg{max-width:84%;padding:12px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}
  .msg.bot{border-bottom-left-radius:5px}
  .msg.user{background:var(--user);color:var(--user-ink);border-color:var(--user);border-bottom-right-radius:5px}
  .msg p{margin:0 0 .6em}.msg p:last-child{margin-bottom:0}
  .msg ul,.msg ol{margin:.3em 0 .6em;padding-left:1.25em}.msg li{margin:.25em 0}.msg li::marker{color:var(--accent)}
  .msg a{color:var(--link);font-weight:700}
  .dots{display:inline-flex;gap:5px;padding:4px 2px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:.9}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px 12px 58px}
  @media (max-width:520px){.chips{padding-left:16px;padding-right:16px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}}
  .chip{font:inherit;font-size:.95rem;display:inline-flex;align-items:center;gap:9px;padding:8px 15px 8px 11px;border-radius:999px;border:2px solid var(--chip-line);background:var(--card);color:var(--ink);cursor:pointer;transition:background .15s;flex:none}
  .chip::before{content:"";flex:none;width:13px;height:19px;border-radius:50%;border:2px solid var(--chip-line);background:transparent;transition:background .15s,border-color .15s}
  .chip:hover,.chip:focus-visible{background:var(--accent-soft)}
  .chip:hover::before,.chip:focus-visible::before{background:var(--accent);border-color:var(--accent)}
  .chip:focus-visible,#q:focus-visible,#send:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--card)}
  #q{flex:1;min-width:0;font:inherit;padding:13px 18px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
  #q:focus{border-color:var(--head)}
  #send{font:inherit;font-weight:700;padding:0 24px;border-radius:999px;border:0;background:var(--head);color:var(--head-ink);cursor:pointer}
  #send:hover{filter:brightness(1.15)}
  footer{padding:8px 18px 12px;font-size:.8rem;color:var(--muted);background:var(--card)}
  footer a{color:var(--link)}
  .langbar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
  .langbar label{flex:none;font-weight:700}
  #lang{flex:1;min-width:0;font:inherit;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
  #lang:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .langbtn{font:inherit;font-weight:700;margin:3px 6px 3px 0;padding:6px 14px;border-radius:999px;border:2px solid var(--chip-line);background:var(--card);color:var(--ink);cursor:pointer}
  .langbtn:hover,.langbtn:focus-visible{background:var(--accent-soft)}
  @media (prefers-reduced-motion: reduce){#log{scroll-behavior:auto}.dots i{animation:none;opacity:.6}.chip,.chip::before{transition:none}}
  @media (max-width:480px){body{font-size:17px}.msg{max-width:88%}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="titles"><h1 id="t-title">California Voter Helper</h1><p id="t-sub">Plain answers about registering and voting.</p></div>
    <span class="tag" id="t-tag">No login needed</span>
  </header>
  <div class="langbar"><label for="lang">🌐 Language / Idioma / 语言</label><select id="lang"></select></div>
  <div class="banner" id="banner" hidden></div>
  <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
  <div class="chips" id="chips" aria-label="Suggested questions"></div>
  <form id="form" autocomplete="off">
    <label for="q" id="q-label" style="position:absolute;left:-9999px">Type your question</label>
    <input id="q" type="text" placeholder="Ask about registering, deadlines, mail ballots…" maxlength="200">
    <button id="send" type="submit">Send</button>
  </form>
  <footer id="foot">
    This is an independent helper and not an official government site. Always confirm important details with the
    <a href="https://www.sos.ca.gov/elections/" target="_blank" rel="noopener">California Secretary of State</a>
    or your county elections office.
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Dates for the November 3, 2026 General Election ---------- */
  function endOf(y,m,d){ return new Date(y,m-1,d,23,59,59); }
  var now = new Date();
  var PHASE = now <= endOf(2026,10,19) ? "open"
            : now <= endOf(2026,11,3)  ? "conditional"
            : "over";

  var HOTLINE = '<a href="tel:+18003458683">(800) 345-VOTE (8683)</a>';
  var A = function(url,label){ return '<a href="'+url+'" target="_blank" rel="noopener">'+label+'</a>'; };
  var REG = A("https://registertovote.ca.gov/","registertovote.ca.gov");
  var SOS = A("https://www.sos.ca.gov/elections/","sos.ca.gov/elections");
  var STATUS = A("https://voterstatus.sos.ca.gov/","voterstatus.sos.ca.gov");
  var CENTERS = A("https://caearlyvoting.sos.ca.gov/","caearlyvoting.sos.ca.gov");

  var overNote = '<p>The November 3, 2026 General Election has passed, so this is general guidance that applies to future elections. Exact dates for the next one are posted at '+SOS+'.</p>';

  /* ---------- Topics ---------- */
  var T = {};

  T.greet = { html: function(){
    return '<p>Hi, I’m the California Voter Helper. I can walk you through registering, deadlines, voting by mail, voting in person, and who to contact.</p><p>Tap a question below or type your own.</p>';
  }, next: ["register","dates","mail","inperson","status","contact"] };

  T.register = { label:"How do I register?", kw:["register","registration","sign up","signup","become a voter","enroll","apply to vote","new voter","first time"], html: function(){
    if(PHASE==="over") return overNote + '<p>To register for a future election, apply online at '+REG+'. You will need a California driver’s license or ID number (or the last four digits of your Social Security number) and your date of birth.</p>';
    var s = '<p>The fastest way is online at '+REG+'. On that page, choose <strong>Register to Vote Now</strong>. It takes a few minutes and is available in 10 languages.</p>'
      + '<p>Have these ready.</p><ul><li>Your California driver’s license or ID number, or the last four digits of your Social Security number</li><li>Your date of birth</li></ul>'
      + '<p>No computer? Call '+HOTLINE+' or your county elections office and ask for a paper form to be mailed to you.</p>';
    if(PHASE==="open") s += '<p><strong>Deadline for the November 3 election is Monday, October 19, 2026.</strong> Online applications must be in by then, and mailed forms must be postmarked by then.</p><p>If you miss it, you can still register and vote on the same day (see “Missed the deadline”).</p>';
    else s += '<p><strong>The regular deadline for the November 3 election passed on October 19.</strong> You can still register and vote on the same day. Tap “Missed the deadline” for how.</p>';
    return s;
  }, next:["eligible","late","status","contact"] };

  T.late = { label:"Missed the deadline", kw:["late","missed","too late","same day","same-day","conditional","election day registration","deadline passed","after the deadline"], html: function(){
    if(PHASE==="over") return '<p>In California the regular registration deadline is 15 days before Election Day. If you miss it, you can still register and vote on the same day with <strong>same-day registration</strong>, also called conditional voter registration. Go to your county elections office or a vote center, up to and including Election Day.</p><p>Your ballot is counted once the county confirms your registration. Find the dates for the next election at '+SOS+'.</p>';
    return '<p>You can still take part. California offers <strong>same-day registration</strong>, also called conditional voter registration, for people who miss the deadline.</p>'
      + '<ul><li>It is available from October 20 through Election Day, November 3, 2026.</li>'
      + '<li>Go to your county elections office or a vote center, register, and vote a provisional ballot right there.</li>'
      + '<li>Your ballot is counted once the county confirms your registration.</li>'
      + '<li>You may be asked for ID, so bring a driver’s license, state ID, or another document that shows your name and address.</li></ul>'
      + '<p>Find a location at '+CENTERS+'. On Election Day, vote centers are open 7 a.m. to 8 p.m.</p>';
  }, next:["inperson","id","contact"] };

  T.eligible = { label:"Am I eligible?", kw:["eligible","eligibility","can i vote","who is allowed","qualify","felony","felon","old enough","convicted","parole","probation"], html: function(){
    return '<p>You can register to vote in California if you are</p><ul><li>A U.S. citizen and a California resident</li><li>At least 18 years old on Election Day</li><li>Not currently serving a state or federal prison term for a felony</li><li>Not found mentally incompetent to vote by a court</li></ul>'
      + '<p>Not sure about your own situation? Call '+HOTLINE+' or your county elections office. They can answer questions about specific cases.</p>';
  }, next:["prereg","register","contact"] };

  T.prereg = { label:"I’m 16 or 17", boost:3, kw:["i'm 17","im 17","i am 17","i'm 16","im 16","i am 16","16 or 17","17 years","16 years","pre-register","preregister","pre register","16","17","teen","teenager","high school","under 18","not 18"], html: function(){
    return '<p>You can <strong>pre-register</strong> at 16 or 17 if you meet the other requirements. Apply at '+REG+', and you will be registered automatically on your 18th birthday.</p><p>Pre-registering does not change the voting age. You still have to be 18 to cast a ballot.</p>';
  }, next:["eligible","register","contact"] };

  T.status = { label:"Check my registration", kw:["status","am i registered","check","registered","already registered","verify","look up","lookup","party"], html: function(){
    return '<p>Three quick ways to check.</p><ul><li>Online with the My Voter Status tool at '+STATUS+'</li><li>Text <strong>VOTE</strong> to <strong>GOVOTE (468-683)</strong></li><li>Call '+HOTLINE+'</li></ul><p>It will also show your county and political party preference.</p>';
  }, next:["moved","register","mail"] };

  T.dates = { label:"Key dates", kw:["date","dates","when","deadline","deadlines","calendar","election day","timeline","schedule"], html: function(){
    if(PHASE==="over") return '<p>The November 3, 2026 election has passed. These rules repeat for California elections.</p><ul><li>Register to vote at least <strong>15 days before</strong> Election Day. Same-day registration is available after that, through Election Day.</li><li>Counties begin mailing a ballot to every active registered voter about 29 days before Election Day.</li><li>In-person vote centers open about 10 days before, and more open about 3 days before.</li><li>The last day to ask for a replacement ballot by mail is 7 days before Election Day.</li><li>On Election Day, polls and vote centers are open <strong>7 a.m. to 8 p.m.</strong></li><li>Mailed ballots must be postmarked by Election Day and arrive within 7 days.</li></ul><p>Exact dates for the next election are at '+SOS+'.</p>';
    return '<p>Key dates for the <strong>November 3, 2026 General Election</strong>.</p><ul>'
      + '<li><strong>October 5</strong> Counties begin mailing ballots</li>'
      + '<li><strong>October 6</strong> Secure ballot drop boxes open</li>'
      + '<li><strong>October 19</strong> Last day to register by the regular deadline</li>'
      + '<li><strong>October 20 to November 3</strong> Same-day registration at county offices and vote centers</li>'
      + '<li><strong>October 24</strong> First vote centers open in Voter’s Choice Act counties</li>'
      + '<li><strong>October 31</strong> Remaining in-person vote centers open</li>'
      + '<li><strong>November 3</strong> Election Day. Polls open 7 a.m. to 8 p.m.</li></ul>'
      + '<p>Mailed ballots must be postmarked by November 3 and arrive within 7 days. The full calendar is at '+SOS+'.</p>';
  }, next:["mail","inperson","late"] };

  T.mail = { label:"Voting by mail", kw:["mail","vote by mail","mail-in","mail in","ballot","return","drop box","dropbox","drop off","postage","postmark","stamp"], html: function(){
    if(PHASE==="over") return overNote + '<p>In general, every active registered voter is mailed a ballot before each election, and you can return it by mail, at a drop box, or in person.</p>';
    return '<p>Every active registered voter in California is mailed a ballot, so you do not need to request one. County offices began mailing them by October 5.</p>'
      + '<p>You can return it in any of these ways.</p><ul>'
      + '<li><strong>By mail.</strong> Postage is prepaid. It must be postmarked on or before November 3 and reach your county within 7 days.</li>'
      + '<li><strong>At a drop box.</strong> Secure drop boxes opened October 6.</li>'
      + '<li><strong>In person.</strong> At your county elections office, a vote center, or a polling place by 8 p.m. on November 3.</li></ul>'
      + '<p>Mail is slowing down now, so a drop box or vote center is the safest choice this close to Election Day. Sign your ballot envelope so it can be counted.</p>';
  }, next:["noballot","track","inperson","dates"] };

  T.noballot = { label:"I didn’t get my ballot", boost:14, kw:["never got","didn't receive","didnt receive","did not get","did not receive","havent gotten","haven't gotten","never came","no ballot","spilled","spill","ruined","stained","stain","tore","torn","ripped","destroyed","wet","messed up","filled out wrong","made a mistake","why haven't i received","why havent i received","haven't i received","havent i received","yet","hasn't come","hasnt come","hasn't arrived","hasnt arrived","when will i get my ballot","when will my ballot","didn't get","didnt get","not received","never received","haven't received","havent received","lost","replacement","missing","damaged","mistake","spoiled","new ballot"], html: function(){
    if(PHASE==="over") return '<p>If your ballot is missing, damaged, or spoiled, contact your county elections office as soon as you notice and ask for a replacement. Replacements by mail can be requested up to 7 days before Election Day. After that, you can still vote in person at your county elections office or a vote center and get a ballot there.</p><ul><li>Check '+STATUS+' to confirm your address and registration are current.</li><li>Common reasons a ballot doesn’t show up are an old address on file, because ballots are not forwarded, or registering after the registration deadline.</li></ul><p>Not sure which county to call? Ring '+HOTLINE+' and they will point you to it.</p>';
    return '<p><strong>It is too late to get a replacement ballot by mail for this election.</strong> The last day to ask for one was October 27. <strong>You can still vote in person.</strong> Go to your county elections office or any vote center and you can get a ballot and vote there. On Election Day, November 3, they are open 7 a.m. to 8 p.m., and if you are in line by 8 p.m. you can still vote.</p>'
      + '<p>Here is what else to know.</p><ul><li>Find the closest vote center at '+CENTERS+'.</li><li>If your ballot was damaged or spoiled, this is the same situation as a missing ballot, so voting in person is your option.</li><li>Check '+STATUS+' to confirm your address and registration are current.</li><li>If it simply hasn’t shown up, two common reasons are an old address on file, because ballots are not forwarded, or registering after the October 19 mail deadline.</li></ul>'
      + '<p>You can also contact your county elections office to ask about your options. Not sure which one to call? Ring '+HOTLINE+' and they will point you to it.</p>';
  }, next:["inperson","moved","contact"] };

  T.whynoballot = { boost:18, strong:["why haven't i received","why havent i received","why haven't i gotten","why havent i gotten","why hasn't my ballot","why hasnt my ballot","why didn't i get","why didnt i get","why didn't i receive","why didnt i receive","haven't received my mail","havent received my mail","haven't received my ballot","havent received my ballot","not received my ballot","ballot hasn't arrived","ballot hasnt arrived","ballot hasn't come","ballot hasnt come","when will i get my ballot","when will my ballot","where is my mail in ballot","where is my mail ballot"], kw:["why haven't i received","why havent i received","haven't received my mail","havent received my mail"], html: function(){
    if(PHASE==="over") return '<p>If a mail ballot hasn’t arrived, these are the most common reasons.</p><ul><li><strong>You registered after the registration deadline.</strong> Mail ballots go to people registered by the deadline. Later registrants can use same-day registration and vote in person.</li><li><strong>The address on file is out of date.</strong> Ballots are not forwarded, so a ballot can go to your old address.</li><li><strong>Your registration is not active or is missing.</strong> Counties mail ballots to active registered voters. Check '+STATUS+'.</li><li><strong>Mail delays.</strong> It may simply be late or lost.</li></ul><p>Contact your county elections office and ask for a replacement. Replacements by mail can be requested up to 7 days before Election Day. After that, you can vote in person and get a ballot there. Not sure which county to call? Ring '+HOTLINE+'.</p>';
    return '<p>Counties began mailing ballots by October 5, so if your registration was in order, yours should have come by now. Here are the most common reasons it hasn’t.</p><ul><li><strong>You registered after October 19.</strong> Mail ballots go to people registered by that deadline. If you registered later, you can use same-day registration and vote in person.</li><li><strong>The address on file is out of date.</strong> Ballots are not forwarded, so it may have gone to an old address.</li><li><strong>Your registration is not active or is missing.</strong> Counties mail ballots to active registered voters. Check yours at '+STATUS+'.</li><li><strong>Mail delays.</strong> It may simply be late or lost.</li></ul><p><strong>What to do now.</strong> Check '+STATUS+', then contact your county elections office. The last day to ask for a replacement by mail was October 27, so the way to get a ballot now is to vote in person at your county elections office or any vote center. On Election Day, November 3, they are open 7 a.m. to 8 p.m., and if you are in line by 8 p.m. you can still vote.</p><p>Find the closest one at '+CENTERS+'. Not sure which county to call? Ring '+HOTLINE+'.</p>';
  }, next:["inperson","status","noballot","contact"] };

  T.track = { label:"Track my ballot", boost:6, kw:["got casted","casted","been cast","got cast","know if my ballot","tell if my ballot","check if my ballot","see if my ballot","know if my mail","tell if my mail","check if my mail","see if my mail","did my ballot","was my ballot","been received","got counted","been counted","did they get my ballot","track","where's my ballot","wheres my ballot","was my ballot counted","received my ballot","counted"], html: function(){
    return '<p>You can sign up for <strong>Where’s My Ballot?</strong> to get updates when your ballot is mailed, received, and counted. Start at '+A("https://california.ballottrax.net/voter/","california.ballottrax.net/voter")+'.</p><p>You can also check your registration at '+STATUS+'.</p>';
  }, next:["mail","status","contact"] };

  T.inperson = { label:"Voting in person", kw:["in person","in-person","vote center","polling","polling place","where do i vote","where to vote","early voting","early","hours","open","location","near me"], html: function(){
    if(PHASE==="over") return '<p>You can vote in person even if you got a mail ballot. Vote centers open about 10 days before Election Day, and on Election Day they are open <strong>7 a.m. to 8 p.m.</strong> If you are in line by 8 p.m., you can still vote.</p><p>When an election is coming up, you can find the closest vote center or drop box at '+CENTERS+'. Whether your county uses neighborhood polling places or larger vote centers can differ, so check your county elections office for your address.</p>';
    return '<p>You can vote in person even if you got a mail ballot. I can’t look up a ZIP code or address myself, but you can find the vote center, drop box, or polling place closest to you at '+CENTERS+'. Enter your address or county there.</p>'
      + '<ul><li>Early vote centers are generally open daily from 10 a.m. to 7 p.m. Some opened October 24 and the rest open October 31, so dates and hours vary a bit by county.</li>'
      + '<li>On Election Day, November 3, they are open <strong>7 a.m. to 8 p.m.</strong></li>'
      + '<li>If you are in line by 8 p.m., you can still vote.</li></ul>'
      + '<p>Bring your mail ballot if you have it, or tell staff you want to vote there. Whether your county uses neighborhood polling places or larger vote centers, and the hours, can differ, so use the lookup above for your address.</p>';
  }, next:["id","late","mail","contact"] };

  T.id = { label:"Do I need ID?", boost:0, strong:["photo id","which id","what id","bring id","show id","need id","need an id","id to vote","identification","passport"], kw:["id","identification","photo id","driver","license","bring","passport"], html: function(){
    return '<p>Most California voters <strong>do not need to show ID</strong> to vote.</p><p>The exception is a first-time voter who registered by mail and did not give a driver’s license or ID number or the last four digits of a Social Security number. You may be asked to show ID, such as a photo ID or a document with your name and address. If you are unsure, bring one.</p><p>If you use same-day registration, bring ID or a document showing your name and address as well. A lost ID or no passport is not a barrier for most voters. If you are asked, any document that shows your name and address can work, and your county elections office or '+HOTLINE+' can tell you what applies to you.</p>';
  }, next:["inperson","register","contact"] };

  T.lostid = { boost:12, strong:["lost my id","lost id","lost my license","lost my driver","dont have id","don t have id","don't have id","do not have id","dont have an id","don't have an id","do not have an id","no id","no passport","without id","without an id","forgot my id","left my id","stolen id","expired id","my id expired","lost my passport"], kw:["lost my id","lost id","no id","lost my license","lost my driver","no passport","without id","without an id","forgot my id","expired id"], html: function(){
    return '<p>Not having an ID is usually <strong>not a problem</strong> in California. Most voters, including people voting in person, are not asked to show ID.</p><ul><li>If you have voted in California before, you do not need ID.</li><li>If you registered with a driver’s license or ID number, or the last four digits of your Social Security number, you should not be asked for ID.</li><li>The main exception is a first-time voter who registered by mail without giving one of those numbers. If you are asked, a document that shows your name and address can work, so it does not have to be a photo ID or passport.</li></ul><p>If you plan to use same-day registration, ask your county elections office what they will need. You can also call '+HOTLINE+' before you go. If you have lost your ID, you can still go to a vote center and tell the staff your situation.</p>';

  T.zip = { boost:8, test:function(t){ return /(^|\D)\d{5}(\D|$)/.test(t) && /poll|vote center|voting center|drop box|dropbox|drop off|where|near|closest|nearest|location|site|address/i.test(t); }, html: function(){
    if(PHASE==="over") return '<p>I can’t look up voting sites by ZIP code. When an election is coming up, use the official lookup at '+CENTERS+', enter your street address or choose your county, and pick the vote center or drop box closest to you. On Election Day they are open 7 a.m. to 8 p.m. For help, call '+HOTLINE+' or your county elections office.</p>';
    return '<p>I can’t look up voting sites by ZIP code, so I can’t name the closest one for you. Here is the quickest way to find it.</p><ol><li>Open the official lookup at '+CENTERS+'.</li><li>Enter your <strong>street address</strong> or choose your county. A full address gives the best results.</li><li>Pick the vote center or drop box closest to you and check its hours.</li></ol><ul><li>Vote centers are generally open daily from 10 a.m. to 7 p.m., and on Election Day, November 3, from <strong>7 a.m. to 8 p.m.</strong></li><li>If you are in line by 8 p.m., you can still vote.</li><li>Have a mail ballot already? You can drop it at any secure drop box or vote center instead of mailing it.</li></ul><p>If the lookup doesn’t work for you, call '+HOTLINE+' or your county elections office.</p>';

  T.moved = { label:"I moved or changed my name", kw:["moved","move","new address","address","change name","name change","married","party preference","re-register","reregister","update registration"], html: function(){

  T.results = { label:"Election results", kw:["result","results","who won","winner","count","counting"], html: function(){

  T.guide = { label:"What’s on my ballot?", kw:["on my ballot","propositions","proposition","measures","voter guide","voter information guide","guide","candidates","election about","what election","what is the election","whats the election","what's the election","who is running","governor","what am i voting"], html: function(){
    if(PHASE==="over") return '<p>The November 3, 2026 election has passed. For the next election, the official Voter Information Guide at '+A("https://voterguide.sos.ca.gov/","voterguide.sos.ca.gov")+' explains the statewide contests and measures once it is published, and your county elections office can tell you about local races. I can’t see your personal ballot, and I can’t recommend candidates or measures.</p>';
    return '<p>The November 3, 2026 General Election includes statewide offices such as Governor and Secretary of State, all U.S. House seats, the state legislature, and ballot propositions, plus local contests that depend on where you live.</p><p>The official Voter Information Guide explains the statewide contests and measures. Read it at '+A("https://voterguide.sos.ca.gov/","voterguide.sos.ca.gov")+'. I can’t see your personal ballot or local races, so your county elections office is the place to ask about those.</p><p>I can’t recommend candidates or measures, but I’m happy to help with how and where to vote.</p>';

  T.contact = { label:"Talk to a person", kw:["contact","phone","call","number","email","speak","human","person","representative","help","office","county","mailing address","write","who can i ask","who do i ask","closed","hotline","after hours","after work","work till","work until","office hours","nobody answers","no one answers"], html: function(){
    return '<p>I’m here around the clock, but if you need a person, here is who to reach.</p><ul>'
      + '<li><strong>Secretary of State voter hotline</strong> '+HOTLINE+'</li>'

  T.citizen = { boost:4, kw:["green card","permanent resident","visa","not a citizen","noncitizen","non-citizen","immigrant","daca","legal resident","citizenship","naturalized"], html: function(){
    return '<p>In California you must be a <strong>U.S. citizen</strong> to register to vote, so a green card or visa on its own does not make you eligible. If you have become a naturalized citizen, you can register like any other citizen.</p><p>Registering when you are not eligible can cause serious problems, so if you are unsure, call '+HOTLINE+' before you submit anything.</p>';

  T.notpossible = { boost:6, kw:["vote online","vote by email","vote by text","vote by phone","vote on my phone","vote on the internet","vote by internet","vote over the phone","vote through an app","online or by email","register by text","register by phone","register by email","register over the phone","text to register","by text message","vote by fax"], html: function(){
    return '<p>You can’t cast your vote by email, text, phone, or an online form in California. Ballots are returned by mail, at a drop box, or in person.</p><p>You <strong>can</strong> register online at '+REG+'. Texting <strong>VOTE</strong> to <strong>GOVOTE (468-683)</strong> only checks your registration status and does not register you. To register on paper, call '+HOTLINE+' and ask for a form to be mailed to you.</p><p>Voters with disabilities can ask their county elections office about accessible vote-by-mail options.</p>';
  }, next:["register","mail","status","contact"] };

  T.requestballot = { boost:10, kw:["request my mail","request a ballot","request mail","request a mail","request my ballot","apply for a mail","sign up for mail","ask for a ballot","how do i get a ballot","how do i get my ballot","get my ballot","get a mail"], html: function(){

    return '<p>You don’t need to request a ballot. California mails one automatically to every active registered voter, and counties began sending them by October 5.</p><p>If yours hasn’t arrived, tap “I didn’t get my ballot.” If you are not registered yet, register first, or use same-day registration at a vote center.</p>';

  T.local = { boost:4, kw:["unincorporated","city election","city elections","city council","local election","local elections","local race","local races","polling place or a vote center","polling place or vote center","vote center or polling","difference between a polling","depends on my county","depends on the county","does it depend on where"], html: function(){
    return '<p>Some things are the same statewide, and some depend on your county or city. This helper can only speak to the statewide rules.</p><ul><li><strong>Same everywhere.</strong> Registration deadline, every registered voter getting a mail ballot, and polls open 7 a.m. to 8 p.m. on Election Day.</li><li><strong>Varies by county.</strong> Whether you vote at a neighborhood polling place or a larger vote center, early voting dates and hours, and the exact drop box and vote center locations.</li><li><strong>Varies by where you live.</strong> Which city, school, and district contests are on your ballot. Living in an unincorporated area usually means you vote on county and district contests but not city ones, but your county elections office can confirm for your address.</li></ul><p>Look up your own locations at '+CENTERS+', or ask your county elections office.</p>';
  }, next:["inperson","guide","contact"] };

  T.transit = { label:"Getting to the polls", boost:4, kw:["transit","bus","buses","train","trains","ride","rides","transportation","no car","get to the polls","get to the vote","get to vote","lyft","uber","metro","trolley","fare"], html: function(){
    if(PHASE==="over") return '<p>There is no statewide free transit program in California. Each transit agency decides, and many offer free or discounted rides on Election Day in some years. Check your local transit agency’s website or social media as an election gets close.</p><p>You also may not need a ride, since you can return a mail ballot to a nearby drop box. Find locations at '+CENTERS+' when an election is coming up.</p>';
    return '<p>There is no statewide free transit program in California. It is decided by each transit agency, so check yours.</p><p>Agencies I found announcing free rides on Election Day, November 3, 2026.</p><ul><li><strong>LA Metro</strong> all buses and trains, plus Metro Micro and Metro Bike Share</li><li><strong>North County Transit District (San Diego County)</strong> COASTER, SPRINTER, BREEZE and more. It does not include San Diego MTS.</li><li><strong>Marin Transit</strong> local buses</li><li><strong>Big Blue Bus (Santa Monica)</strong> system-wide</li></ul><p>Other agencies may offer it too, so check your local agency’s website. You may also not need a ride, because you can drop a mail ballot at a nearby drop box. Find locations at '+CENTERS+'.</p>';
  }, next:["inperson","mail","contact"] };

  T.away = { boost:6, strong:["out of the state","out of state","outside of california","outside california","different state","another state","other state","not in california","out of town"], kw:["college","student","students","out of state","out of the state","outside of california","outside california","different state","another state","other state","not in california","out of town","out of the country","away from home","dorm","campus","military","overseas","abroad","deployed","absentee"], html: function(){
    if(PHASE==="over") return '<p>Your ballot is mailed to the address on your voter registration. If you will be outside California or your ballot did not reach you, contact your county elections office or call '+HOTLINE+' and ask whether it can be sent to where you are. If you now live in another state, you register and vote there. Find your state’s process at '+A("https://vote.gov/","vote.gov")+'. Military and overseas voters have their own forms at '+SOS+'.</p>';
    return '<p>Your ballot is mailed to the address on your voter registration. If you are outside California, or your ballot did not reach you, here is what to do.</p><ul><li>Contact your county elections office right away, or call '+HOTLINE+' and ask for your county’s number. Ask whether a replacement can be sent to where you are now.</li><li>Mailed ballots count if they are postmarked by November 3 and reach your county within 7 days. Mail is tight this close to Election Day, so ask about the fastest option.</li><li>If you can get to a California vote center before 8 p.m. on November 3, you can vote in person there.</li><li>If you now live in another state, you register and vote there, not in California. Find your state’s process at '+A("https://vote.gov/","vote.gov")+'.</li><li>Military and overseas voters have their own forms. Start at '+SOS+'.</li></ul>';
  }, next:["noballot","moved","contact"] };

  T.otherstate = { boost:9, kw:["resident of florida","live in florida","living in florida","moved to florida","florida","resident of another state","resident of texas","not a california resident","no longer live in california","moved out of california","moved out of state","moved to another state","not a resident"], html: function(){
    return '<p>You can vote in California only if you live here. If you are now a resident of another state, you register and vote in that state, where its own rules and deadlines apply. I can only help with California.</p><p>Find your state’s registration and voting information at '+A("https://vote.gov/","vote.gov")+', or contact your new state’s elections office. If you still have a California address you are returning to, I can help with that.</p>';

  T.thirdparty = { boost:15, strong:["my sister","my brother","my daughter","my son","my husband","my wife","my mom","my dad","my mother","my father","filled out my","someone else filled"], kw:["filled out my","filled in my","filled out and mailed","someone else filled","someone else mailed","sister","brother","my daughter","my son","my husband","my wife","my spouse","my mom","my mother","my dad","my father","my roommate","my partner","her ballot","his ballot","their ballot","on my behalf"], html: function(){
    return '<p>A ballot should be marked and signed by the voter it belongs to. Here is how that plays out.</p><ul><li><strong>If someone else filled out and mailed your ballot.</strong> Call your county elections office right away, explain what happened, and ask what options you have. If you think it may involve misuse of your voter information, you can report it to '+HOTLINE+'.</li><li><strong>If you want to send a ballot to a family member.</strong> It goes to the address on that person’s registration. If they live in another state, they should contact their county elections office to have it sent to them there. They must complete and sign it themselves. California lets a voter authorize someone else to return a completed ballot, but confirm the details with the county.</li></ul><p>I can’t give legal advice, and the county can tell you what applies to your situation.</p>';
  }, next:["noballot","track","contact"] };

  T.votematters = { boost:6, kw:["does my vote count","does my vote even count","does my vote matter","vote even count","blue state","red state","safe state","is it worth voting","why vote","does voting matter","my vote matter","will my vote count"], html: function(){
    return '<p>Every valid ballot is counted, and each one counts the same no matter where you live.</p><p>Californians also decide contests that are decided inside the state, such as Governor, the state legislature, U.S. House seats, local offices, and ballot propositions, depending on the election. Some of those races can be close. I can’t predict outcomes, so for what is at stake on your own ballot, see the Voter Information Guide at '+A("https://voterguide.sos.ca.gov/","voterguide.sos.ca.gov")+'.</p>';
  }, next:["guide","inperson","mail"] };

  T.opinion = { boost:5, html: function(){
    return '<p>I can’t say who or what to vote for. That choice is yours. I can help with registering, getting your ballot, and finding where to vote.</p><p>For nonpartisan information on what is on your ballot, try these.</p><ul><li>The official Voter Information Guide at '+A("https://voterguide.sos.ca.gov/","voterguide.sos.ca.gov")+'</li><li>Vote411 from the League of Women Voters at '+A("https://www.vote411.org/","vote411.org")+'</li><li>The California Voter Foundation guide at '+A("https://calvoter.org/","calvoter.org")+'</li></ul>';

    add("inperson",sp.labels.inperson,["id","late","mail","contact"],function(){ return s.inperson; },{test:function(t){ return /\b\d{5}\b/.test(t); }});
    add("id",sp.labels.id,["inperson","register","contact"],function(){ return s.id; },{strong:sp.strong.id||[],boost:3});

  (function(){

      send:"Enviar",
      label:"Escriba su pregunta",
      footer:'Este es un ayudante independiente y no es un sitio oficial del gobierno. Confirme los detalles importantes con la <a href="https://www.sos.ca.gov/elections/" target="_blank" rel="noopener">Secretaría de Estado de California</a> o con la oficina electoral de su condado. Traducido con ayuda de IA.',

    X.greet={ next:["register","dates","mail","inperson","status","contact"], html:function(){

    X.register={ label:"¿Cómo me registro?", kw:["registr","rejistr","registar","inscrib","empadron","primera vez","nuevo votante","nueva votante","sacar mi registro"], next:["eligible","late","status","contact"], html:function(){
      var s='<p>La forma más rápida es en línea en '+REG+'. En esa página, elija <strong>Register to Vote Now</strong> (Registrarse ahora). Toma unos minutos y está disponible en 10 idiomas.</p><p>Tenga a la mano lo siguiente.</p><ul><li>Su número de licencia de conducir o identificación de California, o los últimos cuatro dígitos de su número de Seguro Social</li><li>Su fecha de nacimiento</li></ul><p>¿No tiene computadora? Llame al '+hot+' o a la oficina electoral de su condado y pida que le envíen un formulario en papel por correo.</p>';
      if(PHASE==="open") s+='<p><strong>La fecha límite para la elección del 3 de noviembre es el lunes 19 de octubre de 2026.</strong> Las solicitudes en línea deben enviarse a más tardar ese día, y las enviadas por correo deben tener matasellos de esa fecha o anterior.</p><p>Si no llega a tiempo, todavía puede registrarse y votar el mismo día (toque “Se me pasó la fecha límite”).</p>';

    X.late={ label:"Se me pasó la fecha límite", kw:["muy tarde","ya paso la fecha","se paso la fecha","se me paso","perdi la fecha","mismo dia","misma fecha","condicional","despues de la fecha"], strong:["se me paso la fecha","ya paso la fecha","muy tarde","ya es tarde para reg","ya vencio","vencio el plazo","ya paso el plazo","se acabo el plazo"], next:["inperson","id","contact"], html:function(){
      return '<p>Todavía puede participar. California ofrece el <strong>registro el mismo día</strong>, también llamado registro condicional de votante, para quienes no se registraron a tiempo.</p><ul><li>Está disponible hasta el día de la elección, incluido ese día.'+(PHASE!=="over"?' Para esta elección, del 20 de octubre al 3 de noviembre de 2026.':'')+'</li><li>Vaya a la oficina electoral de su condado o a un centro de votación, regístrese y vote con una boleta provisional en el mismo lugar.</li><li>Su boleta se cuenta cuando el condado confirma su registro.</li><li>Es posible que le pidan identificación, así que lleve su licencia de conducir, una identificación estatal u otro documento que muestre su nombre y dirección.</li></ul><p>Busque un lugar en '+CENTERS+'. El día de la elección, los centros de votación abren de 7 a. m. a 8 p. m.</p>';
    }};

    X.eligible={ label:"¿Puedo votar?", kw:["elegible","eligib","puedo votar","poder votar","calific","requisitos","ciudadan","delito","felon","antecedentes","libertad condicional","prision","residente","visa","inmigr","soy de otro pais"], strong:["green card","tarjeta verde","residente permanente","no soy ciudadan"], boost:4, next:["prereg","register","contact"], html:function(){
      return '<p>Puede registrarse para votar en California si cumple con lo siguiente.</p><ul><li>Es ciudadano(a) de EE. UU. y residente de California</li><li>Tiene al menos 18 años el día de la elección</li><li>No está cumpliendo actualmente una condena en una prisión estatal o federal por un delito grave</li><li>Un tribunal no lo ha declarado mentalmente incapaz de votar</li></ul><p><strong>Importante.</strong> Tener una green card (residencia permanente) o una visa por sí sola no le da derecho a registrarse. Debe ser ciudadano(a) de EE. UU. Si se hizo ciudadano(a) por naturalización, puede registrarse como cualquier otro ciudadano. Registrarse sin ser elegible puede causar problemas graves, así que si tiene dudas, llame al '+hot+' antes de enviar cualquier solicitud.</p>';
    }};

    X.prereg={ label:"Tengo 16 o 17 años", kw:["16 anos","17 anos","tengo 16","tengo 17","pre reg","prereg","pre rej","pre-reg","menor de 18","adolescente"], boost:6, next:["eligible","register","contact"], html:function(){
      return '<p>Puede <strong>preregistrarse</strong> a los 16 o 17 años si cumple con los demás requisitos. Solicítelo en '+REG+' y quedará registrado(a) automáticamente cuando cumpla 18 años.</p><p>El preregistro no cambia la edad para votar. Debe tener 18 años para emitir su voto.</p>';

    X.status={ label:"Revisar mi registro", kw:["estoy registrad","ya estoy registr","revisar mi registro","verificar","consultar mi registro","comprobar","estatus","estado de mi registro","partido politico","buscar mi registro","si estoy registr"], next:["register","mail","contact"], html:function(){
      return '<p>Tres formas rápidas de revisarlo.</p><ul><li>En línea con la herramienta My Voter Status en '+STATUS+'</li><li>Envíe un mensaje de texto con la palabra <strong>VOTE</strong> al <strong>GOVOTE (468-683)</strong></li><li>Llame al '+hot+'</li></ul><p>También muestra su condado y su preferencia de partido político.</p>';

    X.dates={ label:"Fechas importantes", kw:["fecha","cuando","calendario","dia de la eleccion","que dia","dia es la eleccion","limite","plazo"], next:["mail","inperson","late"], html:function(){
      if(PHASE==="over") return '<p>La elección del 3 de noviembre de 2026 ya pasó. Estas reglas se repiten en las elecciones de California.</p><ul><li>Regístrese al menos <strong>15 días antes</strong> del día de la elección. Después de eso, puede usar el registro el mismo día hasta el día de la elección.</li><li>Los condados empiezan a enviar una boleta por correo a todo votante activo unos 29 días antes de la elección.</li><li>Los centros de votación en persona abren unos 10 días antes, y más centros abren unos 3 días antes.</li><li>El último día para pedir una boleta de reemplazo por correo es 7 días antes del día de la elección.</li><li>El día de la elección, los lugares de votación abren de <strong>7 a. m. a 8 p. m.</strong></li><li>Las boletas por correo deben tener matasellos del día de la elección o antes y llegar dentro de 7 días.</li></ul><p>Las fechas exactas de la próxima elección están en '+SOS+'.</p>';
      return '<p>Fechas importantes de la <strong>Elección General del 3 de noviembre de 2026</strong>.</p><ul><li><strong>5 de octubre</strong> Los condados comienzan a enviar las boletas por correo</li><li><strong>6 de octubre</strong> Abren los buzones seguros para boletas</li><li><strong>19 de octubre</strong> Último día para registrarse en la fecha límite regular</li><li><strong>20 de octubre al 3 de noviembre</strong> Registro el mismo día en oficinas del condado y centros de votación</li><li><strong>24 de octubre</strong> Abren los primeros centros de votación en los condados que usan ese modelo</li><li><strong>31 de octubre</strong> Abren los demás centros de votación en persona</li><li><strong>3 de noviembre</strong> Día de la elección. Abren de 7 a. m. a 8 p. m.</li></ul><p>Las boletas por correo deben tener matasellos del 3 de noviembre o antes y llegar dentro de 7 días. El calendario completo está en '+SOS+'.</p>';
    }};

    X.mail={ label:"Votar por correo", kw:["correo","boleta","papeleta","enviar mi voto","devolver","buzon","estampilla","sello","matasello","depositar","entregar mi boleta","dejar mi boleta","pedir mi boleta","solicitar","como pido","voto por correo"], next:["noballot","track","inperson","dates"], html:function(){
      return '<p>California envía una boleta por correo a todo votante activo registrado antes de cada elección, así que no necesita pedirla.</p><p>Puede devolverla de cualquiera de estas formas.</p><ul><li><strong>Por correo.</strong> El franqueo ya está pagado. Debe tener matasellos del día de la elección o antes y llegar a su condado dentro de 7 días.</li><li><strong>En un buzón.</strong> Los buzones seguros para boletas ya están abiertos.</li><li><strong>En persona.</strong> En la oficina electoral de su condado, en un centro de votación o en un lugar de votación a más tardar a las 8 p. m. del día de la elección.</li></ul><p>Firme el sobre de su boleta para que se pueda contar. Si falta poco para la elección, un buzón o un centro de votación es la opción más segura.</p>';
    }};

    X.noballot={ label:"No me llegó mi boleta", kw:["no me lleg","no lleg","nunca lleg","no recibi","no he recibido","todavia no","todabia","aun no","perdi mi boleta","se me perdio","derram","manch","rompi","danad","arruin","reemplazo","remplazo","otra boleta","nueva boleta","boleta nueva","por que no me","porque no me","x q ","fuera del estado","fuera de california","otro estado","no estoy en california"], strong:["no me lleg","nunca lleg","no he recibido","no recibi","derram","manch","otra boleta","nueva boleta","reemplazo","perdi mi boleta"], boost:14, next:["inperson","contact","status"], html:function(){
      var a;
      if(PHASE!=="over") a='<p><strong>Ya es tarde para pedir que le envíen una boleta de reemplazo por correo para esta elección.</strong> El último día para pedirla fue el 27 de octubre. <strong>Todavía puede votar en persona.</strong> Vaya a la oficina electoral de su condado o a cualquier centro de votación y allí le darán una boleta para votar. El 3 de noviembre abren de 7 a. m. a 8 p. m., y si está en la fila a las 8 p. m., todavía puede votar.</p>';
      else a='<p>Si su boleta se perdió, se dañó o no le llegó, comuníquese cuanto antes con la oficina electoral de su condado y pida una de reemplazo. Se puede pedir por correo hasta 7 días antes del día de la elección. Después de eso, aún puede votar en persona en la oficina electoral de su condado o en un centro de votación y recibir allí una boleta.</p>';
      return a+'<p>Esto es lo que más conviene saber.</p><ul><li>Una boleta dañada o manchada es lo mismo que una boleta perdida.</li><li>Si no le ha llegado, las razones más comunes son que su dirección registrada está desactualizada (las boletas no se reenvían), que se registró después de la fecha límite o que su registro no está activo. Revíselo en '+STATUS+'.</li><li>Si está fuera de California, llame a la oficina electoral de su condado o al '+hot+' y pregunte si pueden enviarle la boleta a donde está. Las boletas por correo cuentan si tienen matasellos del día de la elección o antes y llegan dentro de 7 días.</li><li>Encuentre el centro de votación más cercano en '+CENTERS+'.</li></ul><p>¿No sabe a qué condado llamar? Llame al '+hot+' y le indicarán.</p>';
    }};

    X.inperson={ label:"Votar en persona", kw:["en persona","centro de votacion","lugar de votacion","lugar pa votar","lugar para votar","casilla","donde voto","donde votar","donde esta el lugar","mas cerca","serca","cerca de mi","donde puedo votar","donde puedo ir a votar","donde queda","cerca de mi casa","a que hora","a q ora","horario","abren","abierto","votacion temprana","codigo postal"], strong:["donde puedo votar","donde puedo ir a votar"], test:function(t){ return /\b\d{5}\b/.test(t) && /lugar|donde|dónde|cerca|serca|casilla|centro|buzon|buzón|sitio|votar/i.test(t); }, next:["id","late","mail","contact"], html:function(){
      return '<p>Puede votar en persona aunque haya recibido una boleta por correo. No puedo buscar lugares por código postal, pero puede encontrar el centro de votación, buzón o lugar de votación más cercano en '+CENTERS+'. Escriba allí su dirección completa o elija su condado.</p><ul><li>Antes del día de la elección, los centros de votación suelen abrir todos los días de 10 a. m. a 7 p. m. Las fechas y horarios varían un poco según el condado.</li><li>El día de la elección abren de <strong>7 a. m. a 8 p. m.</strong></li><li>Si está en la fila a las 8 p. m., todavía puede votar.</li></ul><p>Lleve su boleta por correo si la tiene, o diga al personal que quiere votar allí. Si ya tiene su boleta lista, también puede dejarla en cualquier buzón seguro o centro de votación en vez de enviarla por correo.</p>';
    }};

    X.id={ label:"¿Necesito identificación?", kw:["identificacion","identif"," id ","pasaporte","licencia","documento","mi id","sin id"], strong:["perdi mi id","perdi mi licencia","sin id","no tengo id","no tengo identificacion","no tengo pasaporte","sin pasaporte","sin identificacion"], boost:3, next:["inperson","register","contact"], html:function(){
      return '<p>La mayoría de los votantes de California <strong>no necesita mostrar identificación</strong> para votar. Haber perdido su ID o no tener pasaporte tampoco suele ser un problema.</p><ul><li>Si ya votó antes en California, no necesita identificación.</li><li>Si se registró con el número de su licencia de conducir o identificación de California, o con los últimos cuatro dígitos de su Seguro Social, no deberían pedírsela.</li><li>La excepción principal es una persona que vota por primera vez, se registró por correo y no dio ninguno de esos números. Si se la piden, sirve cualquier documento que muestre su nombre y dirección. No tiene que ser una identificación con foto ni un pasaporte.</li></ul><p>Si va a usar el registro el mismo día, pregunte a la oficina electoral de su condado qué necesitará. También puede llamar al '+hot+' antes de ir. Si perdió su identificación, igual puede ir a un centro de votación y explicar su situación al personal.</p>';
    }};

    X.contact={ label:"Hablar con una persona", kw:["persona real","humano","hablar con","llamar","llamada","telefono","numero","correo electronico","oficina","condado","ayuda","linea","cerrada","cerrado","trabajo hasta","nadie contesta","nadie me ayuda"], next:["register","status","mail"], html:function(){
      return '<p>Estoy disponible las 24 horas, pero si necesita hablar con una persona, aquí le indico con quién comunicarse.</p><ul><li><strong>Línea para votantes de la Secretaría de Estado</strong> '+hot+'</li><li><strong>Correo electrónico</strong> <a href="mailto:elections@sos.ca.gov">elections@sos.ca.gov</a></li><li><strong>La oficina electoral de su condado</strong> Ahí se guarda su registro de votante y suele ser la vía más rápida para preguntas locales. Busque la suya en '+SOS+'.</li></ul><p>Si la línea está cerrada cuando usted puede llamar, puede escribir por correo electrónico, usar este ayudante a cualquier hora o enviar la palabra <strong>VOTE</strong> al <strong>GOVOTE (468-683)</strong> para revisar su registro. Para algo urgente, los centros de votación tienen personal el día de la elección de 7 a. m. a 8 p. m.</p>';
    }};

    X.transit={ label:"Cómo llegar a votar", kw:["transporte","autobus","camion","tren","metro","gratis","gratuito","sin carro","no tengo carro","no tengo coche","como llegar","pasaje","viaje gratis"], boost:4, next:["inperson","mail","contact"], html:function(){
      if(PHASE==="over") return '<p>En California no hay un programa estatal de transporte gratis. Cada agencia de transporte decide, y muchas ofrecen viajes gratis o con descuento el día de la elección en algunos años. Revise el sitio web o las redes sociales de su agencia local cuando se acerque una elección.</p><p>Tal vez ni necesite un viaje, porque puede dejar su boleta por correo en un buzón cercano. Busque ubicaciones en '+CENTERS+' cuando haya una elección próxima.</p>';
      return '<p>En California no hay un programa estatal de transporte gratis. Cada agencia de transporte decide, así que revise la suya.</p><p>Agencias que encontré con viajes gratis el día de la elección, 3 de noviembre de 2026.</p><ul><li><strong>LA Metro</strong> todos los autobuses y trenes, además de Metro Micro y Metro Bike Share</li><li><strong>North County Transit District (condado de San Diego)</strong> COASTER, SPRINTER, BREEZE y más. No incluye el MTS de San Diego.</li><li><strong>Marin Transit</strong> autobuses locales</li><li><strong>Big Blue Bus (Santa Mónica)</strong> todo el sistema</li></ul><p>Otras agencias podrían ofrecerlo también, así que visite el sitio web de su agencia local. Tal vez ni necesite un viaje, porque puede dejar su boleta en un buzón cercano. Busque ubicaciones en '+CENTERS+'.</p>';
    }};

    X.opinion={ kw:["por quien","x quien","a quien voto","quien debo","candidato","recomiend","por cual"], boost:6, next:["register","dates","mail","inperson"], html:function(){
      return '<p>No puedo decirle por quién ni por qué votar. Esa decisión es suya. Puedo ayudarle con el registro, con su boleta y con encontrar dónde votar.</p><p>Para información no partidista sobre lo que aparece en su boleta, puede consultar estos recursos.</p><ul><li>La Guía Oficial de Información para el Votante en '+guide+'</li><li>Vote411 de la Liga de Mujeres Votantes en '+A("https://www.vote411.org/","vote411.org")+'</li><li>La guía de la Fundación de Votantes de California en '+A("https://calvoter.org/","calvoter.org")+'</li></ul>';

    X.thirdparty={ kw:["mi hermana","mi hermano","mi hija","mi hijo","mi esposo","mi esposa","mi mama","mi papa","alguien mas","yeno","lleno mi boleta","llenaron","firmo por mi"], strong:["mi hermana","mi hermano","mi hija","mi hijo","mi esposo","mi esposa","yeno mi","lleno mi boleta","llenaron mi"], boost:15, next:["noballot","track","contact"], html:function(){
      return '<p>La boleta debe ser marcada y firmada por la persona a quien pertenece. Así funciona.</p><ul><li><strong>Si otra persona llenó y envió su boleta.</strong> Llame de inmediato a la oficina electoral de su condado, explique lo que pasó y pregunte qué opciones tiene. Si cree que se usó indebidamente su información de votante, puede reportarlo al '+hot+'.</li><li><strong>Si quiere enviar una boleta a un familiar.</strong> La boleta se envía a la dirección que figura en el registro de esa persona. Si vive en otro estado, debe comunicarse con la oficina electoral de su condado para que se la envíen allá. Esa persona debe llenarla y firmarla ella misma. California permite que un votante autorice a otra persona a entregar su boleta ya completada, pero confirme los detalles con el condado.</li></ul><p>No puedo dar asesoría legal. El condado puede decirle qué aplica a su situación.</p>';
    }};

    X.track={ label:"Seguir mi boleta", kw:["ya conto","se conto","si llego mi boleta","fue recibida","rastrear","seguimiento","donde esta mi boleta","contaron mi voto","cuenta mi boleta","conto mi boleta"], boost:8, next:["mail","status","contact"], html:function(){
      return '<p>Puede inscribirse en <strong>Where’s My Ballot?</strong> (¿Dónde está mi boleta?) para recibir avisos cuando su boleta sea enviada, recibida y contada. Empiece en '+A("https://california.ballottrax.net/voter/","california.ballottrax.net/voter")+'.</p><p>También puede revisar su registro en '+STATUS+'.</p>';

    X.votematters={ kw:["mi voto cuenta","mi voto sirve","mi voto importa","sirve mi voto","vale mi voto","estado azul","estado asul","estado rojo","vale la pena votar","para que votar","pa q votar","cuenta mi voto"], boost:8, next:["register","dates","mail","inperson"], html:function(){
      return '<p>Cada boleta válida se cuenta, y todas valen lo mismo sin importar dónde viva usted.</p><p>Además, los californianos deciden contiendas que se resuelven dentro del estado, como gobernador, la legislatura estatal, los escaños de la Cámara de Representantes de EE. UU., cargos locales y proposiciones, según la elección. Algunas de esas contiendas pueden ser muy reñidas. No puedo predecir resultados. Para saber qué está en juego en su boleta, consulte la Guía de Información para el Votante en '+guide+'.</p>';

    X.thanks={ kw:["gracias","muchas gracias","grax"], next:["register","dates","mail","inperson"], html:function(){ return '<p>De nada. ¿Puedo ayudarle con algo más?</p>'; }};

    X.otherstate={ kw:["vivo en florida","bivo en florida","florida","texas","nueva york","vivo en otro estado","bivo en otro estado","ahora vivo en","ahora bivo en","ya no vivo en california","me mude a","me fui a vivir","residente de otro estado","no soy residente"], strong:["ahora vivo en","ahora bivo en","ya no vivo en california","vivo en otro estado","bivo en otro estado","me mude a otro estado"], boost:9, next:["eligible","moved","contact"], html:function(){

    X.moved={ label:"Me mudé o cambié mi nombre", kw:["me mude","cambie de direccion","nueva direccion","cambio de direccion","cambiar mi direccion","cambiar mi nombre","cambie mi nombre","cambio de nombre","me case","preferencia de partido","actualizar mi registro","volver a registr","cambiar de partido","mi direccion"], boost:2, next:["late","status","contact"], html:function(){

    X.guide={ label:"¿Qué hay en mi boleta?", kw:["en mi boleta","proposicion","propuesta","medidas","guia del votante","guia oficial","candidatos","que hay en la eleccion","de que trata la eleccion","gobernador","quien se postula","quienes se postulan"], next:["inperson","mail","contact"], html:function(){
      if(PHASE==="over") return '<p>La elección del 3 de noviembre de 2026 ya pasó. Para la próxima, la Guía Oficial de Información para el Votante en '+guide+' explica las contiendas y medidas estatales cuando se publica, y la oficina electoral de su condado puede informarle sobre las contiendas locales. No puedo ver su boleta personal ni recomendar candidatos o medidas.</p>';

    I18N.es=P;
  })();

    s:{
      greet:'<p>您好！我是加州选民助手。我可以说明如何登记、重要的截止日期、如何邮寄或亲自投票，以及可以联系谁。</p><p>请点选下方问题，或直接输入您的问题。</p>',
      reg:'<p>最快的方式是在线登记，网址是 {REG}。请选择 <strong>Register to Vote Now</strong>（立即登记）。只需几分钟，网站提供 10 种语言。</p><p>请准备好以下资料。</p><ul><li>加州驾照或加州身份证号码，或社会安全号码的后四位</li><li>出生日期</li></ul><p>没有电脑？请拨打 {HOT} 或联系您所在县的选举办公室，索取纸质表格邮寄给您。</p>',
      regOpen:'<p><strong>2026 年 11 月 3 日选举的登记截止日期是 10 月 19 日（星期一）。</strong>在线申请须在当天提交，邮寄的表格邮戳须为当天或更早。</p><p>如果来不及，仍可在当天登记并投票（请点选“错过了截止日期”）。</p>',
      regCond:'<p><strong>11 月 3 日选举的正常登记截止日期（10 月 19 日）已过。</strong>您仍可在当天登记并投票，请点选“错过了截止日期”了解方法。</p>',
      regOver:'<p>2026 年 11 月 3 日的选举已经结束。加州的正常登记截止日期是选举日前 15 天。下次选举的日期请见 {SOS}。</p>',
      late:'<p>您仍然可以投票。加州提供<strong>当天登记</strong>（也称有条件登记），适用于没有及时登记的人。</p><ul><li>可在选举日之前及选举日当天办理。</li><li>请前往您所在县的选举办公室或任何投票中心，登记后当场用临时选票投票。</li><li>县选举办公室确认您的登记资格后，您的选票就会被计票。</li><li>可能会要求出示证件，请带上驾照或其他显示您姓名和地址的文件。</li></ul><p>请在 {CENTERS} 查找地点。选举日当天，投票中心开放时间为上午 7 点至晚上 8 点。</p>',
      elig:'<p>符合以下条件即可在加州登记投票。</p><ul><li>您是美国公民，并且是加州居民</li><li>在选举日当天年满 18 岁</li><li>目前没有因重罪在州立或联邦监狱服刑</li><li>没有被法院裁定为无行为能力投票</li></ul><p><strong>重要。</strong>仅持有绿卡（永久居民）或签证<strong>不能</strong>登记投票，必须是美国公民。入籍后成为公民者可以像其他公民一样登记。如果不是公民却登记，可能带来严重后果，所以有疑问请先拨打 {HOT}。</p><p>16 或 17 岁的人可以先预先登记，年满 18 岁时自动生效。请到 {REG} 办理。</p>',
      status:'<p>有三种快速的查询方式。</p><ul><li>在线使用 My Voter Status 工具，网址是 {STATUS}</li><li>发送短信，内容为 <strong>VOTE</strong>，号码是 <strong>GOVOTE（468-683）</strong></li><li>拨打 {HOT}</li></ul><p>这里也会显示您所属的县和政党偏好。</p>',
      dates:'<p><strong>2026 年 11 月 3 日大选</strong>的重要日期。</p><ul><li><strong>10 月 5 日</strong> 各县开始寄出邮寄选票</li><li><strong>10 月 6 日</strong> 安全投票箱开放</li><li><strong>10 月 19 日</strong> 正常登记截止日</li><li><strong>10 月 20 日至 11 月 3 日</strong> 可在县选举办公室和投票中心当天登记</li><li><strong>10 月 24 日</strong> 部分县的投票中心开放</li><li><strong>10 月 31 日</strong> 其余投票中心开放</li><li><strong>11 月 3 日</strong> 选举日，上午 7 点至晚上 8 点</li></ul><p>邮寄选票的邮戳须为 11 月 3 日或更早，并在 7 天内送达。完整日历见 {SOS}。</p>',
      datesOver:'<p>2026 年 11 月 3 日的选举已经结束。加州每次选举的规则大致如下。</p><ul><li>至少在选举日前 <strong>15 天</strong>登记，之后可用当天登记。</li><li>各县约在选举前 29 天开始向所有活跃选民寄出邮寄选票。</li><li>投票中心约在选举前 10 天开放，约 3 天前开放更多。</li><li>要求寄送替换选票的截止日是选举日前 7 天。</li><li>选举日当天投票时间为<strong>上午 7 点至晚上 8 点</strong>。</li><li>邮寄选票的邮戳须为选举日或更早，并在 7 天内送达。</li></ul><p>下次选举的确切日期见 {SOS}。</p>',
      mail:'<p>加州会在每次选举前向所有登记的活跃选民寄出邮寄选票，您无需申请。</p><p>您可以用以下任一方式交回。</p><ul><li><strong>邮寄。</strong>邮资已付。邮戳须为选举日或更早，并在 7 天内送达您所在的县。</li><li><strong>投入投票箱。</strong>安全选票投票箱已经开放。</li><li><strong>亲自交回。</strong>可在选举日晚上 8 点前交到县选举办公室、投票中心或投票站。</li></ul><p>请务必在选票信封上签名，否则无法计票。离选举日很近时，投票箱或投票中心最保险。</p>',
      nbOpen:'<p><strong>这次选举已经来不及申请邮寄替换选票了。</strong>最后申请日是 10 月 27 日。<strong>但您仍可亲自投票。</strong>请前往县选举办公室或任何投票中心，现场领取选票投票。11 月 3 日开放时间为上午 7 点至晚上 8 点，晚上 8 点前排在队伍中的人仍可投票。</p>',
      nbOver:'<p>如果选票遗失、损坏或没收到，请尽快联系县选举办公室申请替换。可在选举日前 7 天之前申请邮寄。之后仍可亲自到县选举办公室或投票中心领票投票。</p>',
      nbTail:'<ul><li>弄脏或损坏的选票和遗失的选票一样处理。</li><li>没收到的常见原因包括登记地址已过时（选票不会转寄）、登记晚于截止日，或登记状态不是“活跃”。请在 {STATUS} 查看。</li><li>如果您人在加州以外，请打电话给县选举办公室或 {HOT}，询问能否寄到您目前的地址。邮戳为选举日或更早，并在 7 天内送达的选票有效。</li><li>最近的投票中心见 {CENTERS}。</li></ul>',
      inperson:'<p>即使收到了邮寄选票，您也可以亲自投票。我无法按邮政编码查找地点，但您可以在 {CENTERS} 输入完整地址或选择所在的县，查找最近的投票中心、投票箱或投票站。</p><ul><li>选举日之前，投票中心通常每天上午 10 点至晚上 7 点开放，各县略有不同。</li><li>选举日当天开放时间为<strong>上午 7 点至晚上 8 点</strong>。</li><li>晚上 8 点前排在队伍中的人仍可投票。</li></ul><p>如果有邮寄选票，请带上它，或告诉工作人员您要在现场投票。选票已填好的话，也可以放进任何安全投票箱或投票中心，不必邮寄。</p>',
      id:'<p>大多数加州选民<strong>不需要出示证件</strong>就能投票。证件遗失或没有护照通常也没有关系。</p><ul><li>如果您曾在加州投过票，就不需要证件。</li><li>如果您登记时提供了加州驾照或身份证号码，或社会安全号码后四位，通常不会被要求出示证件。</li><li>主要的例外是首次投票、通过邮寄登记、且没有提供上述号码的人。如被要求，任何显示您姓名和地址的文件都可以，不必是带照片的证件，也不必是护照。</li></ul><p>如果要用当天登记，请向县选举办公室确认需要带什么。也可以先拨打 {HOT}。证件遗失的人仍可前往投票中心向工作人员说明情况。</p>',
      contact:'<p>我全天候都在，但如果您想与真人交谈，可以联系以下单位。</p><ul><li><strong>州务卿选民专线（中文）</strong> {HOT}</li><li><strong>电子邮件</strong> <a href="mailto:elections@sos.ca.gov">elections@sos.ca.gov</a></li><li><strong>您所在县的选举办公室</strong> 您的选民登记保存在那里，处理本地问题通常最快。请在 {SOS} 查找。</li></ul><p>如果您能打电话时专线已下班，可以发送电子邮件、随时使用本助手，或发送短信 <strong>VOTE</strong> 到 <strong>GOVOTE（468-683）</strong> 查询登记状态。</p>',
      thanks:'<p>不客气。还有什么可以帮您的吗？</p>'
    }

    s:{
      greet:'<p>Xin chào! Tôi là Trợ lý Cử tri California. Tôi có thể giải thích cách đăng ký, các hạn chót, cách bỏ phiếu qua thư hoặc trực tiếp, và nên liên lạc với ai.</p><p>Xin chọn một câu hỏi bên dưới hoặc tự nhập câu hỏi của quý vị.</p>',
      reg:'<p>Cách nhanh nhất là đăng ký trực tuyến tại {REG}. Xin chọn <strong>Register to Vote Now</strong> (Đăng ký ngay). Chỉ mất vài phút và trang web có 10 ngôn ngữ.</p><p>Xin chuẩn bị sẵn các thông tin sau.</p><ul><li>Số bằng lái xe hoặc thẻ căn cước California, hoặc 4 số cuối của số An Sinh Xã Hội</li><li>Ngày sinh</li></ul><p>Không có máy tính? Xin gọi {HOT} hoặc văn phòng bầu cử quận để nhờ gửi mẫu giấy qua thư.</p>',
      regOpen:'<p><strong>Hạn chót đăng ký cho cuộc bầu cử ngày 3 tháng 11 là Thứ Hai, 19 tháng 10 năm 2026.</strong> Đơn trực tuyến phải nộp trong ngày đó, còn đơn gửi thư phải có dấu bưu điện ngày đó hoặc sớm hơn.</p><p>Nếu quá hạn, quý vị vẫn có thể đăng ký và bỏ phiếu ngay trong ngày (xin chọn “Tôi lỡ hạn chót”).</p>',
      regCond:'<p><strong>Hạn chót đăng ký thông thường cho cuộc bầu cử ngày 3 tháng 11 (19 tháng 10) đã qua.</strong> Quý vị vẫn có thể đăng ký và bỏ phiếu ngay trong ngày. Xin chọn “Tôi lỡ hạn chót” để xem cách thực hiện.</p>',
      regOver:'<p>Cuộc bầu cử ngày 3 tháng 11 năm 2026 đã kết thúc. Tại California, hạn chót đăng ký thông thường là 15 ngày trước ngày bầu cử. Ngày của kỳ bầu cử tới có tại {SOS}.</p>',
      late:'<p>Quý vị vẫn có thể tham gia. California có <strong>đăng ký ngay trong ngày</strong>, còn gọi là đăng ký có điều kiện, dành cho người chưa đăng ký kịp.</p><ul><li>Có thể thực hiện đến hết ngày bầu cử.</li><li>Đến văn phòng bầu cử quận hoặc bất kỳ trung tâm bỏ phiếu nào, đăng ký rồi bỏ phiếu bằng lá phiếu tạm thời ngay tại đó.</li><li>Lá phiếu được kiểm khi quận xác nhận việc đăng ký của quý vị.</li><li>Có thể được yêu cầu giấy tờ, nên hãy mang theo bằng lái hoặc giấy tờ khác có tên và địa chỉ.</li></ul><p>Tìm địa điểm tại {CENTERS}. Vào ngày bầu cử, các trung tâm mở cửa từ 7 giờ sáng đến 8 giờ tối.</p>',
      elig:'<p>Quý vị có thể đăng ký bỏ phiếu ở California nếu đáp ứng các điều kiện sau.</p><ul><li>Là công dân Hoa Kỳ và cư dân California</li><li>Đủ 18 tuổi vào ngày bầu cử</li><li>Hiện không thụ án tù tiểu bang hoặc liên bang vì trọng tội</li><li>Không bị tòa án tuyên bố mất năng lực bỏ phiếu</li></ul><p><strong>Quan trọng.</strong> Chỉ có thẻ xanh (thường trú nhân) hoặc visa thì <strong>không</strong> đủ để đăng ký. Phải là công dân Hoa Kỳ. Người nhập tịch có thể đăng ký như mọi công dân khác. Đăng ký khi không đủ điều kiện có thể gây hậu quả nghiêm trọng, nên nếu còn thắc mắc xin gọi {HOT} trước.</p><p>Người 16 hoặc 17 tuổi có thể đăng ký trước tại {REG}, và sẽ tự động có hiệu lực khi đủ 18 tuổi.</p>',
      status:'<p>Có ba cách kiểm tra nhanh.</p><ul><li>Trực tuyến bằng công cụ My Voter Status tại {STATUS}</li><li>Nhắn tin từ <strong>VOTE</strong> đến <strong>GOVOTE (468-683)</strong></li><li>Gọi {HOT}</li></ul><p>Công cụ này cũng cho biết quận và đảng phái quý vị đã chọn.</p>',
      dates:'<p>Các ngày quan trọng của <strong>Tổng tuyển cử ngày 3 tháng 11 năm 2026</strong>.</p><ul><li><strong>5 tháng 10</strong> Các quận bắt đầu gửi lá phiếu qua thư</li><li><strong>6 tháng 10</strong> Hộp thả phiếu an toàn mở cửa</li><li><strong>19 tháng 10</strong> Hạn chót đăng ký thông thường</li><li><strong>20 tháng 10 đến 3 tháng 11</strong> Đăng ký ngay trong ngày tại văn phòng quận và trung tâm bỏ phiếu</li><li><strong>24 tháng 10</strong> Một số trung tâm bỏ phiếu mở cửa ở các quận áp dụng mô hình này</li><li><strong>31 tháng 10</strong> Các trung tâm còn lại mở cửa</li><li><strong>3 tháng 11</strong> Ngày bầu cử, 7 giờ sáng đến 8 giờ tối</li></ul><p>Phiếu gửi thư phải có dấu bưu điện ngày 3 tháng 11 hoặc sớm hơn và đến nơi trong vòng 7 ngày. Lịch đầy đủ có tại {SOS}.</p>',
      datesOver:'<p>Cuộc bầu cử ngày 3 tháng 11 năm 2026 đã kết thúc. Các quy tắc sau thường lặp lại ở mỗi kỳ bầu cử tại California.</p><ul><li>Đăng ký ít nhất <strong>15 ngày</strong> trước ngày bầu cử. Sau đó có thể đăng ký ngay trong ngày.</li><li>Các quận bắt đầu gửi phiếu qua thư cho mọi cử tri đang hoạt động khoảng 29 ngày trước bầu cử.</li><li>Trung tâm bỏ phiếu mở khoảng 10 ngày trước, và thêm nhiều nơi khoảng 3 ngày trước.</li><li>Hạn chót xin gửi phiếu thay thế qua thư là 7 ngày trước ngày bầu cử.</li><li>Vào ngày bầu cử, điểm bỏ phiếu mở từ <strong>7 giờ sáng đến 8 giờ tối</strong>.</li><li>Phiếu gửi thư phải có dấu bưu điện ngày bầu cử hoặc sớm hơn và đến trong vòng 7 ngày.</li></ul><p>Ngày chính xác của kỳ bầu cử tới có tại {SOS}.</p>',
      mail:'<p>California tự động gửi lá phiếu qua thư cho mọi cử tri đang hoạt động trước mỗi cuộc bầu cử, nên quý vị không cần xin.</p><p>Quý vị có thể gửi lại bằng một trong các cách sau.</p><ul><li><strong>Qua thư.</strong> Đã trả sẵn cước phí. Phải có dấu bưu điện ngày bầu cử hoặc sớm hơn và đến quận trong vòng 7 ngày.</li><li><strong>Bỏ vào hộp thả phiếu.</strong> Các hộp thả phiếu an toàn đã mở cửa.</li><li><strong>Trực tiếp.</strong> Nộp tại văn phòng bầu cử quận, trung tâm bỏ phiếu hoặc điểm bỏ phiếu trước 8 giờ tối ngày bầu cử.</li></ul><p>Nhớ ký tên trên phong bì phiếu thì phiếu mới được kiểm. Khi gần ngày bầu cử, hộp thả phiếu hoặc trung tâm bỏ phiếu là lựa chọn an toàn nhất.</p>',
      nbOpen:'<p><strong>Đã quá muộn để xin gửi lá phiếu thay thế qua thư cho cuộc bầu cử này.</strong> Hạn chót xin là ngày 27 tháng 10. <strong>Nhưng quý vị vẫn có thể bỏ phiếu trực tiếp.</strong> Hãy đến văn phòng bầu cử quận hoặc bất kỳ trung tâm bỏ phiếu nào và nhận lá phiếu tại chỗ. Ngày 3 tháng 11 họ mở cửa từ 7 giờ sáng đến 8 giờ tối, và ai đang xếp hàng lúc 8 giờ tối vẫn được bỏ phiếu.</p>',
      nbOver:'<p>Nếu lá phiếu bị mất, hư hoặc chưa đến, xin liên lạc ngay văn phòng bầu cử quận để xin phiếu thay thế. Có thể xin gửi qua thư đến 7 ngày trước ngày bầu cử. Sau đó vẫn có thể bỏ phiếu trực tiếp tại văn phòng quận hoặc trung tâm bỏ phiếu.</p>',
      nbTail:'<ul><li>Lá phiếu bị bẩn hoặc hư được xử lý giống như lá phiếu bị mất.</li><li>Lý do thường gặp khi chưa nhận được là địa chỉ đăng ký đã cũ (phiếu không được chuyển tiếp), đăng ký sau hạn chót, hoặc tình trạng đăng ký không còn hoạt động. Xin kiểm tra tại {STATUS}.</li><li>Nếu quý vị đang ở ngoài California, hãy gọi văn phòng bầu cử quận hoặc {HOT} để hỏi có gửi đến địa chỉ hiện tại được không. Phiếu có dấu bưu điện ngày bầu cử hoặc sớm hơn và đến trong 7 ngày vẫn được tính.</li><li>Tìm trung tâm bỏ phiếu gần nhất tại {CENTERS}.</li></ul>',
      inperson:'<p>Quý vị có thể bỏ phiếu trực tiếp dù đã nhận phiếu qua thư. Tôi không tra cứu được địa điểm theo mã ZIP, nhưng quý vị có thể tìm trung tâm bỏ phiếu, hộp thả phiếu hoặc điểm bỏ phiếu gần nhất tại {CENTERS}. Xin nhập địa chỉ đầy đủ hoặc chọn quận của quý vị.</p><ul><li>Trước ngày bầu cử, các trung tâm thường mở mỗi ngày từ 10 giờ sáng đến 7 giờ tối, tùy quận.</li><li>Vào ngày bầu cử, mở cửa từ <strong>7 giờ sáng đến 8 giờ tối</strong>.</li><li>Ai đang xếp hàng lúc 8 giờ tối vẫn được bỏ phiếu.</li></ul><p>Hãy mang theo lá phiếu gửi thư nếu có, hoặc nói với nhân viên rằng quý vị muốn bỏ phiếu tại chỗ. Nếu đã điền xong phiếu, quý vị cũng có thể bỏ vào bất kỳ hộp thả phiếu an toàn hoặc trung tâm bỏ phiếu nào thay vì gửi thư.</p>',
      id:'<p>Phần lớn cử tri California <strong>không cần xuất trình giấy tờ tùy thân</strong> khi bỏ phiếu. Mất giấy tờ hoặc không có hộ chiếu thường cũng không sao.</p><ul><li>Nếu đã từng bỏ phiếu ở California thì không cần giấy tờ.</li><li>Nếu khi đăng ký quý vị đã cung cấp số bằng lái hoặc căn cước California, hoặc 4 số cuối An Sinh Xã Hội, thì thường sẽ không bị hỏi.</li><li>Trường hợp ngoại lệ chính là người bỏ phiếu lần đầu, đăng ký qua thư và không cung cấp các số đó. Nếu được yêu cầu, bất kỳ giấy tờ nào có tên và địa chỉ đều được. Không cần phải có hình hay là hộ chiếu.</li></ul><p>Nếu dùng đăng ký ngay trong ngày, hãy hỏi văn phòng bầu cử quận cần mang gì. Quý vị cũng có thể gọi {HOT} trước. Nếu mất giấy tờ, vẫn có thể đến trung tâm bỏ phiếu và trình bày với nhân viên.</p>',
      contact:'<p>Tôi hoạt động mọi lúc, nhưng nếu quý vị muốn nói chuyện với người thật, xin liên lạc như sau.</p><ul><li><strong>Đường dây cử tri của Bộ trưởng Ngoại vụ (tiếng Việt)</strong> {HOT}</li><li><strong>Email</strong> <a href="mailto:elections@sos.ca.gov">elections@sos.ca.gov</a></li><li><strong>Văn phòng bầu cử quận của quý vị</strong> Hồ sơ đăng ký cử tri được lưu ở đó và thường là cách nhanh nhất cho câu hỏi tại địa phương. Tìm tại {SOS}.</li></ul><p>Nếu đường dây đã đóng khi quý vị gọi được, có thể gửi email, dùng trợ lý này bất cứ lúc nào, hoặc nhắn <strong>VOTE</strong> đến <strong>GOVOTE (468-683)</strong> để kiểm tra đăng ký.</p>',
      thanks:'<p>Không có chi. Quý vị cần giúp gì nữa không?</p>'
    }
  });
